  warnings: 10
  strict_build: clean
  rendered_check: >
    All four pages read from build/site. 10,433 words, 42 cross-references, 40 tooltips and
    140 footnote references, no leaked link syntax or citation markers. IV.T2.Ch4 shows only
    two tooltips because it is the full_treatment Chapter for "hive" and the marker
    deliberately skips a term where the surrounding prose is the definition.
