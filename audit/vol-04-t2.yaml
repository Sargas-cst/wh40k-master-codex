cross_title_threads:
  - >
    The corpse-starch of Ch5 and the tallow candles of Ch5 §3 are the same raw material
    processed by two different guilds for two different purposes. Neither source article
    mentions the other; the Chapter sets them side by side.
  - >
    Ch6 closes the loop opened in IV.T1.Ch3: the Officio Assassinorum recruits from the
    Schola, and the children who "disappear one-by-one without any explanation" are, some
    of them, going there to a journey nine in ten do not survive.
  - >
    Ch4's finding that hive gang warfare is the Astra Militarum's unpaid basic training,
    and that the Arbites cull the surplus, connects IV.T1.Ch2's account of what the Arbites
    do and do not police.

process_errors:
  - >
    IV.T2.Ch4 §1 cited [^lex-hive] without declaring it in the Section's sources. Caught by
    the declared-vs-cited check in both directions.
  - >
    IV.T2.Ch6 §4 cited [^lex-schola-progenium] without declaring it. Same check, same fix.

verification:
