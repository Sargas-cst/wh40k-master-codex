attribution_care:
  - >
    Most of the hive anatomy in IV.T2.Ch4 §2 — spire, shell, heat sink, hab zones,
    manufactories — is sourced to Necromunda material and is explicitly about that world.
    The Chapter says so in its opening line rather than generalising it to all 32,380 Hive
    Worlds.
  - >
    IV.T2.Ch7 records that the Ratling inbreeding claim is presented as natural history by
    lex-age-of-strife (used in III.T2.Ch9) and attributed to "the propagandists that spread
    anti-abhuman rhetoric" by lex-ratling. Both framings are reported; neither is chosen.
    Not registered as a contradiction because the underlying claim does not differ — only
    who is said to be making it.

contradictions:
  registered:
    - key: kin-abhuman-or-xenos
      kind: terminology
      why: >
        The Kin article flags its own split: Imperial classification varies between abhuman
        and xenos, with the Inquisition treating them as the latter. Surfaced in
        IV.T2.Ch7 §3. The stake is conscription versus extermination doctrine.

