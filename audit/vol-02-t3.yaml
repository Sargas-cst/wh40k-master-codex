    The fortress-monastery article's table of named Chapter fortresses; individual Chapters
    belong to Volume IV Title 4.
  - >
    Fenris's tribe list, fauna and language sections beyond what explains the society; Nocturne's
    seven Sanctuary Cities individually, and its full geographical gazetteer.
  - >
    Armageddon's war narratives in detail — they are Volume VII Title 2 Chapter 5 — and its
    population figure, which the article itself flags as a census from 690.M37 describing a
    population since replaced.
  - >
    Vigilus's Aestimare and surface gravity, which rest on a third-party campaign website
    rather than a Games Workshop publication.
  - >
    The Tomb World and Death World articles' long tables of named worlds.
  - >
    The T'au Empire's military structure, septs and full client-species roster; those are
    Volume VI Title 5.
