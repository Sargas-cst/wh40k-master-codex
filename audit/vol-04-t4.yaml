source_uncertainty_preserved:
  - >
    The implant count is not fixed. The article says "19-22 (plus, rarely, 1)", and that
    each Chapter uses different sets and methods. Ch12 reports the range rather than
    picking a number, and its Section is titled accordingly.
  - >
    Whether a Space Marine can die of old age is unresolved: the sources offer three cases
    (Dante at 1,100 years, Ludoldus past 2,000, Gravius alive after 10,000 adrift) and then
    state plainly that there is "not enough sufficient data". Ch12 keeps that.
  - >
    Two Foundings are marked "unconfirmed" in the source table — the Imperium is unsure
    whether it created the Mantis Warriors and the Astral Claws. Reported as such.

