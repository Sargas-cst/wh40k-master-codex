threads_closed:
  - >
    Ch12 establishes that gene-seed is produced only inside living Marines, which explains
    why Chapters retrieve their dead — and retrospectively explains III.T4.Ch20, where
    Abaddon's seventh Black Crusade took Blood Angels gene-seed. He was not stealing a
    sample; he was stealing a Chapter's capacity to replace itself.
  - >
    The thousand-Marine cap in Ch13 and the Astartes exclusion from the Senatorum in
    IV.T1.Ch1 are the same measure by the same man in the same period. Ch13 also records
    that Guilliman's own M42 reforms loosened much of the Codex and left that number alone.
  - >
    Ch14's Blood Angels and Ch15's Flesh Tearers are the same wound at two scales: an
    inherited flaw that Ch12 says is degrading, concentrated in an isolated successor line.
  - >
    Ch15's account of records destroyed during the Reign of Blood explains why Chapters do
    not know their own Foundings — and connects to IV.T1.Ch2's Administratum, which keeps
    its records on vellum in departments it has sometimes forgotten it has.

process_errors:
  - >
    Appended lex-codex-astartes to data/sources.yaml without checking; it was already
    registered, and the duplicate key crashed the YAML parser with a stack trace. This was
    the third such incident in Volume IV, so loadYaml now catches DUPLICATE_KEY and reports
    the file, line and key name instead. Proved it by reintroducing a duplicate and reading
    the message, then removing it. Subsequent source registration in this Title checks for
    an existing entry before appending.
  - >
    The possessive check fired twice on Ch14. Both rewritten.

