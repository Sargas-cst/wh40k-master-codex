departures_from_the_brief:
  - >
    The brief gives Ch9 as "Canonisation & the Making of a Saint / Saint Celestine & the
    Living Saints / Relics, Miracles & Shrine Worlds". Relics have no article and shrine
    worlds are already treated in IV.T2.Ch5, where they belong with the pilgrim economy.
    The third Section is Wars of Faith, which the Ecclesiarch may order alone and which the
    sources document properly — and which Ch10 and Ch11 both depend on.

