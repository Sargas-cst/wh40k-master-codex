threads_closed:
  - >
    The Decree Passive is stated in Ch8, and both devices that defeat it are in this Title:
    the Frateris Militia in Ch10, legal because it has no formal connection to the church,
    and the Sororitas in Ch11, legal because the decree says "men". The sources' own phrase
    for the second is that the spirit of the decree was "rather blatantly disregarded".
  - >
    Ch8 establishes that the Emperor outlawed organised religion and that the founding text
    of the state church was written by Lorgar. Ch9 then records the loyalist Primarchs as
    Imperial Saints — which makes Guilliman, who created a new Ecclesiarchy rank in the
    present, a saint of a religion he was raised to deny.
  - >
    Ch10's Confessors — promoted for zeal, whose skill is working a crowd until it denounces
    itself — are the missing step between the Arbites of IV.T1.Ch2, who only monitor whether
    psykers are being rounded up, and the Black Ships of I.T2.Ch9, which only collect them.
  - >
    Ch10's Redemptionists take the Creed's third tenet and delete its list of targets. Their
    factual premise about hive life is the Imperium's own account in IV.T2.Ch4; only the
    conclusion is theirs, and the recorded objection to them is that they cannot be
    controlled rather than that they are wrong.

process_errors:
  - >
    Appended lex-imperial-cult and lex-ecclesiarchy to data/sources.yaml without checking:
    both were already registered, which produced a duplicate-key YAML parse failure. Removed
    the duplicates and confirmed the originals were untouched by diffing the file.
  - >
    The possessive check fired twice — "[[IV.T3.Ch11]]'s subject" in Ch9 and two instances in
    Ch11. All three rewritten. The check has now caught this in every Title of Volume IV.
  - >
    Ch11 §3 declared lex-sisters-of-battle without citing it; the Orders Militant material
    all came from the Adepta Sororitas article. Dropped the declaration, which then left the
    source registered and uncited anywhere, so the entry was removed from sources.yaml
    rather than a citation invented to justify it. The raw page stays cached.

