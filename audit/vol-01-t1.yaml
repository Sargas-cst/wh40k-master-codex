# ---------------------------------------------------------------------------
# CONTRADICTIONS
# ---------------------------------------------------------------------------
contradictions_reverified:
  - id: astronomican-psyker-toll
    outcome: resolved — both figures share one citation marker, so not rival claims.
  - id: gellar-field-spelling
    outcome: >
      resolved — the article itself gives both spellings, and attributes the variant
      to an official Games Workshop web article (tier 1). Not a live dispute.
  - id: imperial-year-fraction
    outcome: >
      reclassified from `numerical/open` to `undefined`. This is not a conflict
      between sources: the article says no in-universe source gives the method, and
      every duration figure sits in a {{Trivia}} block supported by a DakkaDakka
      forum post and arithmetic by named wiki users. The brief treated fan
      calculation as contested canon. No duration is quoted in the prose.
  - id: the-veil-as-structure
    outcome: >
      confirmed, and stronger than recorded. Lexicanum's "Veil" article is about a
      PERSON — a Navis Nobilite magister. There is no article treating the Veil as a
      cosmological boundary at all.

contradictions_found:
  - id: millennium-year-range
    note: Lexicanum's own {{Conflicting Sources}} block. 5th Ed Rulebook is the outlier.
  - id: is-it-really-m42
    note: >
      Whether the present is M42 is "intentionally put into doubt by Games Workshop".
      A deliberate authorial refusal, not an error — and a gift to Chapter 1's thesis.
  - id: age-of-strife-start-date
    note: >
      M23 vs M25, two millennia apart, one citation each, presented in a single
      sentence with no dispute template. Easy to read straight past.

# ---------------------------------------------------------------------------
# UNVERIFIED — omitted or explicitly marked in the prose
# ---------------------------------------------------------------------------
unverified:
  - subject: The Veil as a structure with measurable properties
    reason: No source defines it; Lexicanum's "Veil" is a person.
    disposition: >
      Written as an absence. Chapter 4's first Section reports that the term has no
      referent in the sources, rather than describing a thing.

  - subject: Any duration for the Imperial year fraction
    reason: Fan arithmetic in a {{Trivia}} block, one leg of it a forum post.
    disposition: Omitted entirely. The division into 1,000 parts is stated; no length is.

  - subject: A unified Imperial etiquette or system of forms of address
    reason: >
      Per PROMPT.md §11 no source describes one, and verifying that absence properly
      means searching Volume IV's institutional articles, not Volume I's language
      articles.
    disposition: >
      Section not written. See departures. The register entry stays
      reverified: false, so the validator still blocks prose from citing it.

  - subject: '"The Three Faction Alliances"'
    reason: >
      Not a sourceable concept. "Grand Alliance" returns nothing on Lexicanum, and no
      retrieved article groups the setting into three alliances.
    disposition: >
      Section rewritten to cover what IS attested: the categories of enemy the
      Imperium names in its own doctrine.

  - subject: Physical laws of realspace
    reason: >
      The Real Space article is 512 bytes with a single citation. There is no body of
      sourced material about the physics of the Materium as such.
    disposition: >
      Section rewritten to report the asymmetry itself — that the material universe is
      barely documented as a subject, being defined almost entirely by contrast.

# ---------------------------------------------------------------------------
# DEPARTURES FROM THE PROPOSED SECTION BREAKDOWN
# ---------------------------------------------------------------------------
# PROMPT.md §1: the breakdown is "a proposed breakdown, not a quota"; a Chapter
# carries 2–5 Sections, "determined by what the sources actually support".
# 11 Sections written against 12 proposed.

departures_from_plan:
  - chapter: I.T1.Ch1
    change: '"The Three Faction Alliances" -> "The Enemies the Imperium Names"'
    reason: The proposed concept is not attested anywhere retrieved. The replacement is.

  - chapter: I.T1.Ch2
    change: 3 Sections -> 2. Dropped "Measures, Ranks & Forms of Address".
    reason: >
      §11 says no source describes a unified Imperial etiquette, and the language
      articles are the wrong place to establish that absence. Writing the Section from
      the Gothic articles alone would have meant generalising scattered titles into a
      system — precisely what the brief forbids. Deferred to Volume IV.

  - chapter: I.T1.Ch3
    change: '"Physical Laws of Realspace" -> "The Asymmetry of Real Space"'
    reason: 512 bytes of source. The absence is the honest subject.

  - chapter: I.T1.Ch4
    change: '"Structure of The Veil" -> "The Veil: A Term Without a Referent"'
    reason: >
      Writing the proposed Section would have required inventing the structure it
      describes. This is the first real test of "cut what you cannot source", and the
      Section now reports the gap.

notes: >
  Title 1 turned out to be a good pilot for an unexpected reason: three of the five
  contradictions carried over from §11 live in it, and re-verifying them changed two.
  One (Gellar/Geller) dissolved into a non-dispute attested by GW itself; one (the
  year fraction) was worse than recorded, in that the "conflicting figures" are fan
  arithmetic rather than canon. That is a useful early signal about how much of the
  seeded material needs re-examining rather than transcribing.

  The Title is also unusually well founded in places: the Great Rift article rests on
  an official Warhammer Community page, and the Gellar field variant on another. Both
  are tier 1 — rare for this project.
