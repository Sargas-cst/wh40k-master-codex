title: I.T1
name: Foundations of Reality & Dual Realities
depth_band: full
researched: 2026-07-25

# ---------------------------------------------------------------------------
# QUERIES / RETRIEVALS
# ---------------------------------------------------------------------------
# All retrieval via Special:Export, batched, at the Crawl-delay: 5 that
# Lexicanum's robots.txt requests. 4 requests total for 35 page titles.
# No page was fetched twice; api.php was not touched.

queries:
  - route: Special:Export (batch 1, 16 titles)
    titles: [Warhammer 40,000, Imperial Dating System, High Gothic, Low Gothic,
             Gellar Field, Materium, Empyrean, Soul, Warp Storm, Warp Rift,
             Blackstone Fortress, Pylons, Noctilith, Standard Template Construct,
             Imperial Creed, Psyker]
    outcome: >
      11 articles, 5 redirects. The redirects were the useful part: Materium ->
      Real Space, Empyrean -> Warp, Imperial Creed -> Imperial Cult, Pylons ->
      Pylon, Gellar Field -> Gellar field.

  - route: Special:Export (batch 2, 16 titles)
    titles: [Gellar field, Real Space, Pylon, Imperial Cult, Navigator, Veil,
             Sea of Souls, Cicatrix Maledictum, Imperium of Man, Chaos, Xenos,
             Adeptus Mechanicus, Age of Strife, Terra, Warp travel, Grimdark]
    outcome: >
      14 articles, 3 further redirects (Sea of Souls -> Warp, Cicatrix Maledictum
      -> Great Rift, Warp travel -> Warp jump). "Grimdark" does not exist as a
      Lexicanum article.

  - route: Special:Export (batch 3, 4 titles)
    titles: [Gellar field, Warp jump, Great Rift, Grand Alliance]
    outcome: >
      3 articles. "Grand Alliance" does not exist — see departures, Chapter 1.
      This batch also exposed a retriever bug; see tooling_defects.

# ---------------------------------------------------------------------------
# TOOLING DEFECTS FOUND AND FIXED
# ---------------------------------------------------------------------------
tooling_defects:
  - defect: >
      Slug collision between case-variant page titles. "Gellar Field" and "Gellar
      field" are different pages on MediaWiki (only the first letter is
      case-insensitive) but both slugify to lex-gellar-field. Batch 1 cached the
      redirect stub under that id; batch 2's request for the real article was then
      skipped as "already cached".
    consequence_if_missed: >
      Chapter 3 would have carried a Section apparently sourced to 18 bytes of
      "#REDIRECT [[Gellar field]]" — the exact failure redirect detection exists to
      prevent, walked around by a naming collision.
    fix: >
      frame/retrieve.mjs now distrusts a cached entry when it is a redirect pointing
      at its own slug, or when the cache slot holds a different page title than the
      one requested. Both cases re-fetch and log why.

