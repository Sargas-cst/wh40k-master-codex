chapters:
  - id: III.T2.Ch6
    owns: [dark-age-of-technology]
    sections: 4
    note: >
      Sub-light diaspora, the Warp Drive, the engineered Navigators, and what the golden age
      actually was — a permanently fragmenting civilisation whose wars were merely survivable.
      Ends on the causal link that decides the Volume: the Age of Strife ended because the
      Aeldari Empire fell.
  - id: III.T2.Ch7
    owns: [stc-systems]
    sections: 5
    note: >
      The STCs were artificial intelligences, which makes the Mechanicus's holiest quest and
      its holiest prohibition point at the same object. Most were wrecked not by war but by
      "enthusiastic software specialists".
  - id: III.T2.Ch8
    owns: [the-cybernetic-revolt]
    sections: 5
    note: >
      Gold, Stone and Iron; the turning; the weapons; and the fact that both sources trouble
      to record that the LOYAL Men of Iron were destroyed too. Ends on the Emperor's own
      exception to his own ban, and on UR-025's claim to have met the real Omnissiah.
  - id: III.T2.Ch9
    owns: [age-of-strife]
    sections: 5
    note: >
      Causes in order, the psyker catastrophe, isolation, what survived, why it ended. The
      finding that tolerant worlds fell and repressive worlds survived is stated without
      softening: the Imperium's psyker policy has an empirical basis.
  - id: III.T2.Ch10
    owns: [old-night-on-terra]
    sections: 5
    note: >
      Terra reduced to a desert of warlords fighting over arable land and water, whose
      salvaged powered armour became the basis of Space Marine plate. Mars is included only
      for the contrast — the planet itself is II.T2.Ch5's — and its contemporaneous verdict on
      Terra was that there was nothing worth saving.

contradictions_opened:
  - id: psykers-before-navigators
    kind: sequence
    note: >
      Three positions. The article reasons about source RELIABILITY as well as content,
      flagging that one timeline may be an in-universe Inquisition document.
  - id: cybernetic-revolt-date
    kind: numerical
    note: >
      M23-M25 against late M26. The disagreement tracks the kind of source: the later date
      comes from the Journal of Keeper Cripias, an in-universe 41st-Millennium reconstruction.

judgement_calls:
  - what: The Journal of Keeper Cripias as a source
    decision: caveat carried into the prose, not just the registry
    why: >
      The Imperium's ban on artificial intelligence rests on an in-universe history written by
      a 41st-Millennium librarian working from ruins. The article flags this; burying the flag
      in a footnote would misrepresent how well the founding event is actually known.
  - what: Mars during the Age of Strife
    decision: one Section, deferring to II.T2.Ch5
    why: >
      The canonical-home rule gives Mars to II.T2.Ch5. The material is used here only for the
      Terra/Mars contrast, which is this Chapter's argument.
  - what: The Men of Gold
    decision: reported as the sources give them and not elaborated
    why: >
      They are "mysterious", they made the Men of Stone, and they never appear again. The
      three-metal hierarchy reads as story shape rather than engineering record, and the
      Chapter says so.

new_terms_found_by_the_coverage_check:
