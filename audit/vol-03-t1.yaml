# Audit trail — Volume III, Title 1
title: "Volume III Title 1 — The War in Heaven (60 Million BC)"
covers: Chapters 1-5
depth_band: full
completed_on: 2026-07-25

retrieval:
  pages_added_this_pass:
    - "War_in_Heaven_(Necron)"
    - Necron
    - Biotransference
    - Enslaver
    - Silent_King
    - Krork
    - Jokaero
