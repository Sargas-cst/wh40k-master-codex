findings_worth_keeping:
  - >
    Guard regiments are deliberately not combined-arms: "Infantry Regiments are unlikely to
    contain much or any heavy artillery, while tank regiments contain little to no
    infantry. This was intentionally designed, as it prevents Traitor Regiments from having
    full arsenals should they turn against the Emperor." Every tactical inefficiency in the
    Astra Militarum follows from a decision about loyalty rather than warfare — the same
    instinct as the thousand-Marine cap in IV.T4.Ch13.
  - >
    The Navy was separated from the Imperial Army after the Heresy. During the Great Crusade
    the Legions held the invasion fleets; when half of them defected they defected with the
    means to cross the galaxy and land armies. The Guard now cannot move without a Navy that
    does not report to it, and the Navy's foremost duty is carrying an army it does not
    command.
  - >
    Six of the seven regiments in Ch17 are defined by a catastrophe their world suffered —
    Cadia destroyed, Catachan lethal by ecology, Krieg self-atomised, Tanith annihilated
    mid-founding, Tallarn reduced to desert by the Iron Warriors in M31, Valhalla admired
    for absorbing casualties. Only Mordian is famous for something it chose.

