section_count_note: >
  Three Chapters at three Sections each, against the brief's 2-5. The Guard's material is
  broad rather than deep — the regiment article is largely a taxonomy of regiment types,
  and splitting it further would have produced Sections that restate one another.

source_uncertainty_preserved:
  - >
    The Astra Militarum's strength is explicitly uncountable: "even the Departmento
    Munitorum cannot place a figure on the number of Guardsmen under arms at any one time".
    Ch16 reports that rather than quoting one of the loose estimates.
  - >
    Warship crew figures differ by two orders of magnitude between sources — a battleship
    at "25,000 to 3,000,000 or more depending on sources". Ch18 keeps the range and the
    "depending on sources" qualifier.

