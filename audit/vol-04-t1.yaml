  IV.T1.Ch3: 5
  note: >
    All within the brief's 2-5. Ch3 takes five because the Officio's seven clades cannot be
    compressed further without either merging temples that share no method or dropping the
    Adamus and Maerorus, which are the Chapter's most interesting entries.

contradictions:
  registered:
    - key: who-rules-the-imperium
      kind: edition
      why: >
        Lexicanum flags the passage itself. Dark Imperium has Guilliman as Imperial Regent
        superseding the High Lords; Imperium Maledictum has them continuing to rule after
        his return. Surfaced in IV.T1.Ch1 §4.
  registered_then_withdrawn:
    - key: assassinorum-chain-of-command
      why: >
        Registered while writing IV.T1.Ch2 on the apparent conflict between the
        Administratum article, which lists the Officio among its divisions, and the
        Senatorum article, which seats the Grand Master of Assassins as a High Lord in his
        own right. Reading lex-officio-assassinorum for Ch3 showed the two are not in
        conflict: that article states both facts in consecutive sentences. The entry was
        deleted and the Ch2 callout rewritten as plain prose stating the arrangement.
        Caught before the Title was committed.

