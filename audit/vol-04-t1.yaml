    "Goge Vandire" and "Reign of Blood" were initially given to the-beheading; they belong
    to age-of-apostasy, which already held them. Moved back, and "Gastaph Hediatrix" added
    there since that is where he acts.
  - >
    "Grand Master of Assassins" added to the officio-assassinorum glossary entry's mark
    list; "War Council" and "Council of Terra" to the-beheading.

tooling_defects_found_and_fixed:
  - defect: >
      namedTermCandidates treated the text BETWEEN two adjacent bold spans as a span of its
      own. "…individual Chapters.** Some **operate as…" yielded the candidate "Some", which
      the coverage check then reported against 37 Chapters.
    fix: >
      Reject any capture with whitespace immediately inside the asterisks — Markdown does
      not read "** x **" as emphasis, so a real span never has it. This subsumes the "At
      the" case the trailing-connective rule was added for in Volume III.
  - defect: >
      The new Pass 5 possessive check fired on IV.T1.Ch1 for "The Imperial Creed & the Cult
      Imperialis's" — the same defect fixed across 41 sites earlier the same day.
    fix: Rewritten as "treated in [[IV.T3.Ch8]]". The check did its job on first use.

process_errors:
  - >
    IV.T1.Ch1 was first written to book/vol-04-imperial-codex-the-imperium-of-man/, a
    directory that does not exist in the scaffold — the Write tool created it. Caught by the
    duplicate-Chapter-id check, moved to the real path, and the stray directory removed.
  - >
    A cross-reference to [[III.T3.Ch18]] was written for Konrad Curze's death. Title 3 of
    Volume III ends at Ch17; the Great Scouring is III.T4.Ch18. Caught by the link resolver.

