name: Build codex

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also deploy the built site to GitHub Pages'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: codex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Validate, then build. Validation runs FIRST and fails the job on any
  # dangling cross-reference, uncited draft Section or duplicated canonical
  # home — so a structurally broken codex can never reach the site.
  # -------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Validate structure
        run: node frame/validate.mjs

      - name: Prepare MkDocs input
        run: node frame/build.mjs

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  # -------------------------------------------------------------------------
  # The site is live at https://sargas-cst.github.io/wh40k-master-codex/
  # and publishes on every push to main.
  #
  # Note this job only ever runs after `build` succeeds, and `build` runs the
  # structural validator first — so a dangling cross-reference, a citation to
  # an unrecorded source, or a subject with two canonical homes fails the
  # pipeline and the live site keeps serving the last good version rather than
  # publishing a broken one.
  #
  # Pull requests build but never deploy.
  # -------------------------------------------------------------------------
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
