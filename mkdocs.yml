# MkDocs configuration.
#
# NOTE: docs_dir is build/docs, NOT book/. The tree is generated by
# `node frame/build.mjs`, which resolves [[cross-references]] into real links and
# compiles the Appendix pages out of data/*.yaml. Never edit build/docs by hand —
# it is deleted and regenerated on every build.

site_name: Warhammer 40,000 Master Codex
# Needed for canonical URLs, the sitemap, and correct absolute links. The site is
# served from a repository subpath, not a domain root.
site_url: https://sargas-cst.github.io/wh40k-master-codex/
site_description: >-
  An unofficial, independently written reference to the Warhammer 40,000 setting.
  Every claim is traced to a retrieved source, and every source conflict is recorded
  rather than resolved.

docs_dir: build/docs
site_dir: build/site

repo_url: https://github.com/Sargas-cst/wh40k-master-codex
repo_name: Sargas-cst/wh40k-master-codex
# Points at book/, not build/docs — an "edit this page" link must land on the source
# a human wrote, never on generated output.
edit_uri: edit/main/book/

theme:
  name: material
  language: en
  custom_dir: theme/overrides
  # Disabled deliberately: no Google Fonts request. A curated system serif stack
  # loads instantly, costs no third-party connection, and raises no licensing or
  # privacy question. See theme/overrides/assets/stylesheets/codex.css.
  font: false
  features:
    - navigation.instant     # SPA-style routing; matters on a ~500-section site
    - navigation.tracking
    - navigation.top
    # Two features are deliberately ABSENT, both of which break the contents tree:
    #
    # navigation.sections — renders top-level groups as flat, permanently open
    #   headings. Material's nested nav is collapsible only without it.
    # navigation.prune — renders only the CURRENT Volume's subtree. Every other
    #   Volume becomes a dead label with no toggle and no children, so nine of ten
    #   Volumes cannot be opened at all. It saves page weight and costs the whole
    #   point of a contents tree.
    #
    # The consequence of omitting prune is that every page embeds all 171 entries.
    # That is the correct trade for a reference work whose sidebar IS the map.
    - navigation.footer      # prev/next — this book is meant to be readable front to back
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.tooltips       # glossary terms get a hover definition
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Match system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

extra_css:
  # fonts first: @font-face declarations must be parsed before anything uses them.
  - assets/stylesheets/fonts.css
  # liveries next: it declares the --cx-t-* palette tokens that codex.css maps
  # into the actual theme variables.
  - assets/stylesheets/liveries.css
  - assets/stylesheets/codex.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list          # required: Section anchors are explicit, per schema.md §4
  - footnotes          # required: citations render as footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.smartsymbols

plugins:
  - search:
      separator: '[\s\-\.\,\!\?\(\)\[\]]+'

# Appends a content hash to extra_css/extra_javascript URLs. Material fingerprints
# its own bundles but not ours, and GitHub Pages serves these with a 10-minute
# cache — so without this, a style change is invisible to returning visitors even
# though the deploy contains it. See frame/mkdocs_hooks.py.
hooks:
  - frame/mkdocs_hooks.py

# Explicit nav, deliberately. The brief fixes the reading order and says it carries
# meaning ("nothing important should be referenced long before it is explained"), so
