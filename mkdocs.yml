# MkDocs configuration.
#
# NOTE: docs_dir is build/docs, NOT book/. The tree is generated by
# `node frame/build.mjs`, which resolves [[cross-references]] into real links and
# compiles the Appendix pages out of data/*.yaml. Never edit build/docs by hand —
# it is deleted and regenerated on every build.

site_name: Warhammer 40,000 Master Codex
site_description: >-
  An unofficial, independently written reference to the Warhammer 40,000 setting.
  Every claim is traced to a retrieved source, and every source conflict is recorded
  rather than resolved.

docs_dir: build/docs
site_dir: build/site

# Set these once the GitHub repository exists.
# repo_url: https://github.com/<owner>/<repo>
# repo_name: <owner>/<repo>
# edit_uri: edit/main/book/

theme:
  name: material
  language: en
  features:
    - navigation.instant     # SPA-style routing; matters on a ~500-section site
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.footer      # prev/next — this book is meant to be readable front to back
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Match system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list          # required: Section anchors are explicit, per schema.md §4
  - footnotes          # required: citations render as footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.smartsymbols

plugins:
  - search:
      separator: '[\s\-\.\,\!\?\(\)\[\]]+'

# Explicit nav, deliberately. The brief fixes the reading order and says it carries
# meaning ("nothing important should be referenced long before it is explained"), so
# ordering is not left to a plugin's guess. Extend this as Titles are written.
nav:
  - Home: index.md
  - About This Codex: about.md
  - Appendix A — Reference Apparatus:
      - Master Index: appendix/master-index.md
      - Consolidated Glossary: appendix/glossary.md
      - Disputed Facts Register: appendix/disputed-facts.md
      - Bibliography: appendix/bibliography.md

extra:
  generator: false
  social: []

# TODO(user decision): choose a licence for the original prose before publishing.
# Left unstated here on purpose — it is not mine to pick.
copyright: >-
  Warhammer 40,000 and all associated marks are the property of Games Workshop Ltd.
  This is an unofficial reference work, independently written, with no affiliation with
  or endorsement by Games Workshop.
