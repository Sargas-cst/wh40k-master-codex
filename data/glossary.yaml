# THE MASTER GLOSSARY — each term defined exactly once, everywhere.
#
# PROMPT.md §8: "Never restate a definition inline in twelve places — one correction
# should propagate everywhere."
#
# Prose writes [[g:gellar-field]] and the build links it to this entry, carrying the
# definition as a hover tooltip. The definition exists here and nowhere else. A
# Chapter may of course DISCUSS a term at length where it owns it; what it must not
# do is restate the one-line definition.
#
# Compiles into: Appendix A · Ch 5 — Consolidated Glossary.

warp:
  term: the Warp
  definition: >
    A psychic dimension parallel to real space, formed and fuelled by the emotions
    and souls of sentient beings, in which the laws of time and space do not hold.
  variants: [Warpspace, Immaterium, Empyrean, the Ether, the Aether, Sea of Souls, Realm of Chaos]
  mark: [warp, the warp]  # lowercase use — "warp routes", "perils of the warp", and
                        # several passages quoted from sources that write it that way —
                        # is the same referent, so it is worth marking. Declared
                        # explicitly because proper nouns otherwise require capitals.
  category: cosmology
  sources: [lex-warp]
  full_treatment: I.T1.Ch3

real-space:
  term: real space
  definition: >
    The material universe, as opposed to the parallel dimension of the Warp. Also
    rendered Materium.
  variants: [Materium, Real Space, Warp Space]
  category: cosmology
  sources: [lex-real-space]
  full_treatment: I.T1.Ch3

soul:
  term: soul
  definition: >
    The existence a living creature of flesh and blood has within the Warp — a
    shadow-self of pure energy, parted from the body at death.
  category: cosmology
  sources: [lex-soul]
  full_treatment: I.T2.Ch5

gellar-field:
  term: Gellar field
  definition: >
    The protective system that shields a vessel and its occupants from the Warp and
    from the entities within it while in transit.
  variants: [Geller Field, Gellar Fields]
  category: warp-technology
  sources: [lex-gellar-field]
  full_treatment: I.T1.Ch3

warp-rift:
  term: Warp rift
  definition: >
    A tear in reality linking the Materium to the Immaterium — a weakening of the
    barrier between them, through which Warp entities may pass.
  variants: [Warp Portal, Warp Rifts]
  category: cosmology
  sources: [lex-warp-rift]
  full_treatment: I.T1.Ch4

warp-storm:
  term: Warp storm
  definition: >
    A volatile disturbance affecting both Immaterium and Materium, capable of
    scattering vessels, distorting elapsed time, and cutting whole regions off from
    Warp travel for centuries.
  category: cosmology
  sources: [lex-warp-storm]
  full_treatment: I.T1.Ch4

great-rift:
  term: the Great Rift
  definition: >
    The largest Warp rift ever observed, opened at the end of the 41st Millennium and
    dividing much of the galaxy. Known to the Imperium as the Cicatrix Maledictum.
  variants: [Cicatrix Maledictum, the Warpscar, the Crimson Path, the Mouth of Ruin]
  category: cosmology
  sources: [lex-great-rift]

high-gothic:
  term: High Gothic
  definition: >
    The hierarchic and official language of the Imperium, used in the titles of
    ancient institutions and regarded as holy.
  variants: [Archaic Gothic, Principle Gothic, Prime Gothic]
  category: high-gothic
  sources: [lex-high-gothic]
  full_treatment: I.T1.Ch2

low-gothic:
  term: Low Gothic
  definition: >
    The common tongue of the Imperium, a bastardised descendant of High Gothic that
    varies from world to world.
  variants: [Imperial Gothic]
  category: high-gothic
  sources: [lex-low-gothic]
  full_treatment: I.T1.Ch2

check-number:
  term: check number
  definition: >
    The first element of a full Imperial date, running 0 to 9, recording how
    reliably that date can be related to time on Terra rather than how precise it is.
  variants: [Source Class]
  category: institutions
  sources: [lex-imperial-dating-system]
  full_treatment: I.T1.Ch2

year-fraction:
  term: year fraction
  definition: >
    The second element of a full Imperial date: the year divided into 1,000 equal
    parts numbered 000 to 999. No in-universe source specifies how the division is
    performed.
  category: institutions
  sources: [lex-imperial-dating-system]
  full_treatment: I.T1.Ch2

pylon:
  term: pylon
  definition: >
    A Necron-built structure of blackstone able to suppress Warp phenomena in the
    space around it.
  variants: [Cadian Pylons]
  category: warp-technology
  sources: [lex-pylon]

noctilith:
  term: noctilith
  definition: >
    The material of Necron pylon construction, which interferes with the boundary
    between real space and the Warp. Also called blackstone.
  variants: [blackstone]
  category: warp-technology
  sources: [lex-noctilith]

xenos:
  term: xenos
  definition: >
    Imperial term for all non-human sentient species, synonymous with "alien" from
    the human perspective.
  category: institutions
  sources: [lex-xenos]

imperial-cult:
  term: the Imperial Cult
  definition: >
    The state religion of the Imperium, worshipping the Emperor as god, administered
    by the Ecclesiarchy. Its doctrine is the Imperial Creed.
  variants: [Cult Imperialis, the Imperial Creed]
  category: institutions
  sources: [lex-imperial-cult]

stc:
  term: Standard Template Construct
  definition: >
    Artificial-intelligence systems of the Dark Age of Technology said to have held
    the whole of human technical knowledge, now lost except as degraded hard copies.
  mark: [STC, STCs]     # the prose uses the abbreviation far more often than the full
                        # phrase, and it is unambiguous. Declared rather than left in
                        # variants, which is never auto-marked.
  variants: [STC, STC systems]
  category: technology
  sources: [lex-standard-template-construct]

age-of-strife:
  term: the Age of Strife
  definition: >
    The period of collapse and isolation between the Dark Age of Technology and the
    founding of the Imperium, during which Warp storms severed interstellar travel.
  variants: [Old Night]
  category: chronology
  sources: [lex-age-of-strife]

# --- Volume I Title 2 ------------------------------------------------------

psyker:
  term: psyker
  definition: >
    An individual able to draw energy from the Warp through their own soul and
    manifest it as psychic power.
  variants: [psychic, witch]
  category: cosmology
  sources: [lex-psyker, lex-psionics]
  full_treatment: I.T2.Ch5

psionics:
  term: psionics
  definition: The use of psychic powers, whatever the species employing them.
  variants: [the Force]
  category: cosmology
  sources: [lex-psionics]

the-assignment:
  term: the Assignment
  definition: >
    The Imperium's twenty-four point rating scale for psychic power, named in Greek
    letters and applied by the Scholastica Psykana.
  variants: [Imperial assignment, the assignment scale]
  category: institutions
  sources: [lex-the-assignment]
  full_treatment: I.T2.Ch6

plus-scale:
  term: the plus scale
  definition: >
    Grades beyond the twenty-four point Assignment, for psykers the scale cannot
    characterise. The naming convention reverses, so Alpha Plus is the lowest of them.
  variants: [reversed scale, plus psyker, Alpha Plus]
  category: institutions
  sources: [lex-the-assignment]

blank:
  term: blank
  definition: >
    A human so inert in the Warp as to exert negative psychic influence, carrying a
    region of blankness that psychic power cannot penetrate. Graded Omega.
  variants: [Untouchable, pariah, Omega-Minus]
  category: cosmology
  sources: [lex-blank, lex-the-assignment]
  full_treatment: I.T2.Ch6

psychic-discipline:
  term: psychic discipline
  definition: >
    A branch of psychic talent. The five most common across all species are biomancy,
    divination, pyromancy, telekinesis and telepathy.
  variants: [discipline]
  category: cosmology
  sources: [lex-psyker, lex-psionics]
  full_treatment: I.T2.Ch7

biomancy:
  term: biomancy
  definition: The manipulation of biological energy and processes.
  variants: [biomancer]
  category: cosmology
  sources: [lex-biomancy, lex-psyker]

divination:
  term: divination
  definition: >
    The reading of possible futures and hidden pasts from the Warp. The least common of
    the five principal disciplines in the Imperium.
  variants: [diviner]
  category: cosmology
  sources: [lex-divination, lex-psyker]

pyromancy:
  term: pyromancy
  definition: The creation and manipulation of fire by psychic means.
  variants: [pyromancer, pyrokine]
  category: cosmology
  sources: [lex-pyromancy, lex-psyker]

telekinesis:
  term: telekinesis
  definition: The conversion of psychic energy into physical force.
  variants: [telekine, psykinetic, kinetic]
  category: cosmology
  sources: [lex-telekinesis, lex-psyker]

telepathy:
  term: telepathy
  definition: The contacting and controlling of other minds by psychic means.
  variants: [telepath]
  category: cosmology
  sources: [lex-telepathy, lex-psyker]

psychic-phenomena:
  term: psychic phenomena
  definition: >
    Unintended effects that may occur whenever a psyker draws on the Warp, with risk
    rising in proportion to the power drawn.
  variants: [perils of the warp]
  category: cosmology
  sources: [lex-psychic-phenomena]
  full_treatment: I.T2.Ch8

daemonic-possession:
  term: daemonic possession
  definition: >
    A daemon taking and controlling a host body, often using it as an opening through
    which further entities may enter realspace.
  variants: [possession, Corporeal Host]
  category: cosmology
  sources: [lex-daemonic-possession]
  full_treatment: I.T2.Ch8

adeptus-astra-telepathica:
  term: Adeptus Astra Telepathica
  definition: >
    The Imperial body responsible for collecting, training and sanctioning psykers,
    divided into the League of Black Ships and the Scholastica Psykana.
  category: institutions
  sources: [lex-league-of-black-ships, lex-scholastia-psykana]

league-of-black-ships:
  term: the League of Black Ships
  definition: >
    The recruiting division of the Adeptus Astra Telepathica: a fleet that gathers
    psykers from across the galaxy and carries them to Terra.
  variants: [Black Ships, Blackship, the Black Fleet]
  category: institutions
  sources: [lex-league-of-black-ships]
  full_treatment: I.T2.Ch9

scholastica-psykana:
  term: the Scholastia Psykana
  definition: >
    The training and sanctioning division of the Adeptus Astra Telepathica, which
    classifies psykers and decides which of them will serve and which will be expended.
  variants: [Scholastica Psykana]
  category: institutions
  sources: [lex-scholastia-psykana]
  full_treatment: I.T2.Ch9

soul-binding:
  term: the Soul Binding
  definition: >
    The rite in which a psyker's mind is brought before the Emperor and a portion of
    his essence transferred into it, creating an Astropath. Usually costs the subject
    their sight.
  category: institutions
  sources: [lex-soul-binding]

sanctioned-psyker:
  term: sanctioned psyker
  definition: >
    A psyker tested and trained by the Adeptus Astra Telepathica and permitted to serve
    the Imperium. Those who are not sanctioned are hunted.
  variants: [unsanctioned psyker, rogue psyker]
  category: institutions
  sources: [lex-sanctioned-psyker]
  full_treatment: I.T2.Ch9

psyker-tithe:
  term: the psyker tithe
  definition: >
    The levy of psykers each Imperial world is required to surrender when a Black Ship
    calls, roughly once a century.
  variants: [the Tithe, customary levy]
  category: institutions
  sources: [lex-league-of-black-ships]

# --- Volume I Title 3 ------------------------------------------------------

webway:
  term: the Webway
  definition: >
    A labyrinth of tunnels built by the Old Ones that lies between the Materium and the
    Warp, part of both and in neither, allowing transit without entering the Warp itself.
  variants: [the Labyrinth Dimension, webway]
  category: cosmology
  sources: [lex-webway]
  full_treatment: I.T3.Ch10

webway-gate:
  term: webway gate
  definition: >
    A portal linking realspace to the Webway. Aeldari gates are stable and ancient;
    artificially forced openings are neither.
  variants: [wraithgate, webway portal, Nexus of Webway Gates]
  category: warp-technology
  sources: [lex-webway, lex-webway-gate]

dolmen-gate:
  term: Dolmen Gate
  definition: >
    A Necron device that forces an opening into the Webway, taught to them by the C'tan
    Nyadra'zatha during the War in Heaven.
  category: warp-technology
  sources: [lex-dolmen-gate, lex-webway]

webway-project:
  term: the Webway Project
  definition: >
    The Emperor's secret attempt to give humanity access to the Webway and sever it from
    the Warp entirely, abandoned after Magnus the Red breached its tunnels.
  variants: [the Imperial Webway, the Emperor's Great Work]
  category: institutions
  sources: [lex-webway-project]
  full_treatment: I.T3.Ch12

craftworld:
  term: craftworld
  definition: >
    A continent-sized Aeldari vessel, self-sufficient and housing tens of millions, which
    survived the Fall by fleeing into the void. Originally a trading ship of the Eldar Empire.
  variants: [Craftworld, world-ship]
  category: cosmology
  sources: [lex-craftworld]
  full_treatment: II.T3.Ch10

commorragh:
  term: Commorragh
  definition: >
    The Dark City: the Drukhari capital, built deep inside the Webway from a former
    Aeldari port-city and the sub-realms it absorbed — not one place but a set of nodes
    thousands of light years apart and one step from each other.
  variants: [the Dark City, Port Commorragh, Commoragh]
  category: cosmology
  sources: [lex-commorragh]
  full_treatment: II.T3.Ch10

black-library:
  term: the Black Library
  definition: >
    The Aeldari repository of forbidden knowledge concerning Chaos, hidden in the Webway
    and guarded by Harlequins.
  variants: [the Black Library of Chaos]
  category: institutions
  sources: [lex-black-library-of-chaos]

cegorach:
  term: Cegorach
  definition: >
    The Aeldari trickster god, patron of the Harlequins, who survived the Fall and gave
    his people irony as a defence against pride.
  variants: [the Laughing God, the Great Harlequin, the Great Fool, the First Fool]
  category: cosmology
  sources: [lex-cegorach]

inertialess-drive:
  term: inertialess drive
  definition: >
    Necron propulsion that crosses interstellar distance without entering the Warp, at
    accelerations no living body can survive.
  category: technology
  sources: [lex-inertialess-drive]

narvhal:
  term: Narvhal
  definition: >
    A small, near-unarmed Tyranid bio-ship that detects distant star systems and
    compresses the space between, drawing a hive fleet along a gravitic corridor.
  category: technology
  sources: [lex-narvhal]

slipstream-module:
  term: AL-38 Slipstream Module
  definition: >
    An experimental T'au faster-than-light device that wraps a vessel in antimatter to
    pierce reality, abandoned after the Fourth Sphere disaster.
  variants: [slipstream module, AL-38]
  category: technology
  sources: [lex-al-38-slipstream-module]

# --- Volume I Title 4 ------------------------------------------------------

ctan:
  term: the C'tan
  definition: >
    Beings of pure energy said to be the first entities in existence, described as a
    fundamental constant of the universe. Awakened and enslaved by the Necrontyr, later
    shattered by them.
  variants: [Yngir, Star Gods, star vampires]
  category: cosmology
  sources: [lex-c-tan]
  full_treatment: I.T4.Ch14

necrodermis:
  term: necrodermis
  definition: >
    The living metal that houses a Necron's essence, and which contains a C'tan's
    compressed essence when it manifests in the material world.
  category: technology
  sources: [lex-necrodermis]

ctan-shard:
  term: C'tan Shard
  definition: >
    A fragment of a shattered C'tan, retaining near-unlimited power but bound to Necron
    control.
  variants: [shard]
  category: cosmology
  sources: [lex-c-tan-shard, lex-c-tan]
  full_treatment: I.T4.Ch15

tesseract-labyrinth:
  term: tesseract labyrinth
  definition: >
    A fist-sized Necron cube able to imprison any being, including creatures of pure
    energy such as daemons and C'tan shards.
  category: technology
  sources: [lex-tesseract-labyrinth]

celestial-orrery:
  term: the Celestial Orrery
  definition: >
    A Necron device on Thanatos recording the location of every star in the galaxy, whose
    manipulation is said to extinguish the star it represents.
  category: technology
  sources: [lex-celestial-orrery]

khaine:
  term: Kaela Mensha Khaine
  definition: >
    The Aeldari god of murder, violence, strife, destruction and war, shattered by
    Slaanesh and surviving as fragments lodged in the craftworlds.
  variants: [Khaine, the Lord of Murder, the Bloody-Handed God]
  category: cosmology
  sources: [lex-kaela-mensha-khaine]

isha:
  term: Isha
  definition: >
    The Aeldari goddess of harvest, fertility and nature, forming a trinity with Lileath
    the Maiden and Morai-Heg the Crone.
  variants: [the Mother]
  category: cosmology
  sources: [lex-isha]

gork-and-mork:
  term: Gork and Mork
  definition: >
    The twin gods of the Orks, dwelling in the Great Green — one brutally cunning and the
    other cunningly brutal, though which is which is disputed among Orks.
  variants: [the Ork Gods]
  category: cosmology
  sources: [lex-gork-and-mork]

# --- Volume II Title 1 -----------------------------------------------------

segmentum:
  term: Segmentum
  definition: >
    One of the five great fleet zones into which the Imperium divides its space, each with
    its own navy and a Segmentum Fortress as its base of operations.
  variants: [Segmentae Majoris, segmenta]
  category: institutions
  sources: [lex-segmentum]
  full_treatment: II.T1.Ch1

sector:
  term: sector
  definition: >
    A division of a Segmentum, usually equivalent to a cube two hundred light years on a
    side, defended by its own battlefleet.
  category: institutions
  sources: [lex-sector]

subsector:
  term: subsector
  definition: >
    A block of systems within a sector, ten to twenty light years across, centred on
    populous worlds or the meeting points of warp trade routes.
  variants: [sub-sector]
  category: institutions
  sources: [lex-subsector, lex-sector]

wilderness-space:
  term: wilderness space
  definition: >
    The unadministered volume between sectors and subsectors, which makes up more of the
    galaxy than the Imperium controls.
  variants: [wilderness zones, inter sectors, forbidden zones, frontier space, empty space]
  category: institutions
  sources: [lex-sector]

imperium-sanctus:
  term: Imperium Sanctus
  definition: >
    The half of the Imperium left within the Astronomican's light after the Great Rift
    opened, comprising Segmenta Solar, Pacificus, Tempestus and parts of Ultima and
    Obscurus.
  category: institutions
  sources: [lex-imperium-sanctus]
  full_treatment: II.T1.Ch2

imperium-nihilus:
  term: Imperium Nihilus
  definition: >
    The half of the Imperium cut off beyond the Great Rift, where the Astronomican is
    obscured, travel is extremely dangerous and astropathic contact is difficult.
  variants: [the Dark Imperium]
  category: institutions
  sources: [lex-imperium-nihilus]
  full_treatment: II.T1.Ch2

noctis-aeterna:
  term: the Noctis Aeterna
  definition: >
    The period of catastrophic darkness following the Great Rift's formation, when the
    Astronomican failed and worlds across the galaxy lost contact with the Imperium.
  variants: [the Blackness, the Great Blackness, the Days of Blindness]
  category: chronology
  sources: [lex-noctis-aeterna]

eye-of-terror:
  term: the Eye of Terror
  definition: >
    The largest and best known warp rift in the galaxy, where the Warp coexists with real
    space, lying to the galactic north and west of Terra in Segmentum Obscurus.
  variants: [Ocularis Terribus, Ocularis Malifica, Anathema Nonplus Ultra]
  category: cosmology
  sources: [lex-eye-of-terror]
  full_treatment: II.T1.Ch3

maelstrom:
  term: the Maelstrom
  definition: >
    A majoris-grade interference between the Warp and real space, second only to the Eye of
    Terror among the galaxy's older rifts.
  variants: [the Shadow Mere, the Twisted Reach, the Well of Lies, the Maw, Guair Dromlaith]
  category: cosmology
  sources: [lex-the-maelstrom]

cadian-gate:
  term: the Cadian Gate
  definition: >
    The area of calm space that was the only predictably stable route in and out of the Eye
    of Terror, held open by the blackstone pylons on Cadia.
  category: cosmology
  sources: [lex-cadian-gate, lex-pylon]

ghoul-stars:
  term: the Ghoul Stars
  definition: >
    A desolate region in the extreme galactic north-east, of worlds lit by dying suns.
  variants: [the Ghost Stars]
  category: cosmology
  sources: [lex-ghoul-stars]

halo-zone:
  term: the Halo Zone
  definition: >
    The region of Segmentum Pacificus beyond the Astronomican's light, where Navigators
    must travel blind and mostly refuse to go.
  category: cosmology
  sources: [lex-halo-zone]

# --- Volume II Title 2 -----------------------------------------------------

imperial-palace:
  term: the Imperial Palace
  definition: >
    The Emperor's palace and the Imperium's capital city, a continent-scale complex on Terra
    divided into Inner and Outer Palaces, whose rooms no surviving record lists in full.
  category: institutions
  sources: [lex-imperial-palace]
  full_treatment: II.T2.Ch4

sanctum-imperialis:
  term: the Sanctum Imperialis
  definition: >
    The chamber at the heart of the Inner Palace housing the Golden Throne and the Emperor's
    body, guarded by three hundred Custodes.
  category: institutions
  sources: [lex-terra]

eternity-gate:
  term: the Eternity Gate
  definition: >
    The largest entrance to the Sanctum Imperialis, and the end point of the galactic
    pilgrimage trail — itself the Imperium's foremost pilgrimage site.
  category: institutions
  sources: [lex-terra]

forbidden-fortress:
  term: the Forbidden Fortress
  definition: >
    The complex built through Terra's Himalayas, one peak of which is carved into the Chamber
    of the Astronomican where ten thousand psykers power the beacon with their lives.
  category: institutions
  sources: [lex-terra]

arx-doctrine:
  term: the Arx Doctrine
  definition: >
    The order issued during the Noctis Aeterna ceding much of Terra to mob rule so that
    remaining forces could hold the Palace and the Forbidden Fortress; a quarter of the
    planet was temporarily lost.
  category: institutions
  sources: [lex-terra]

fabricator-general:
  term: the Fabricator-General
  definition: >
    The direct ruler of Mars and head of the Synod of Mars, and thereby of the Cult
    Mechanicus.
  variants: [Fabricator General]
  category: institutions
  sources: [lex-mars]
  full_treatment: II.T2.Ch5

synod-of-mars:
  term: the Synod of Mars
  definition: >
    The ruling body of Mars and, by extension, of the whole Cult Mechanicus.
  variants: [the Great Synod, the Martian Synod]
  category: institutions
  sources: [lex-mars]

treaty-of-olympus:
  term: the Treaty of Olympus
  definition: >
    The union the Emperor established with Mars, bringing the Red Planet into the Imperium
    as a negotiating party rather than a conquest.
  category: institutions
  sources: [lex-mars]

schism-of-mars:
  term: the Schism of Mars
  definition: >
    The Horus Heresy split between the loyalist Mechanicus and the Dark Mechanicum, which
    devastated the planet and which the Dark Mechanicum won.
  category: warfare
  sources: [lex-mars]

ultramar:
  term: Ultramar
  definition: >
    The Ultramarines' quasi-autonomous realm of approximately five hundred inhabited worlds
    on the Eastern Fringe — an empire within an empire, exempt from the ordinary tithe.
  variants: [the Five Hundred Worlds, the Realm of Ultramar]
  category: institutions
  sources: [lex-ultramar]
  full_treatment: II.T2.Ch6

tetrarch:
  term: Tetrarch
  definition: >
    One of four governors appointed by Guilliman over the northern, southern, eastern and
    western sectors of Ultramar; two of the current four are not Ultramarines.
  variants: [Tetrarch of Ultramar, Tetrarchy]
  category: institutions
  sources: [lex-ultramar]

fortress-of-hera:
  term: the Fortress of Hera
  definition: >
    The Ultramarines' fortress-monastery, atop Macragge's Crown Mountains in the centre of
    Magna Macragge Civitas, holding the Shrine of Guilliman.
  category: institutions
  sources: [lex-macragge]

ultramar-auxilia:
  term: the Ultramar Auxilia
  definition: >
    Ultramar's planetary defence forces — well equipped, exempt from the wider tithe, and
    capable of numbering billions of soldiers.
  category: warfare
  sources: [lex-ultramar]

shield-chapters:
  term: the Shield Chapters of Ultramar
  definition: >
    The ten Space Marine Chapters Guilliman ordered permanently stationed within Ultramar,
    all descended from the Ultramarines, giving the realm roughly ten thousand standing
    Astartes.
  category: warfare
  sources: [lex-ultramar]

imperium-secundus:
  term: Imperium Secundus
  definition: >
    The contingency empire Guilliman sought to raise around Ultramar when the Ruinstorm cut
    it off and he feared the Imperium itself was lost.
  category: institutions
  sources: [lex-ultramar]

# --- Volume II Title 3 -----------------------------------------------------

fortress-monastery:
  term: fortress-monastery
  definition: >
    A Space Marine Chapter's headquarters — a fortress devoted equally to battle and worship,
    sited on an Imperial world, a moon or an asteroid, or carried aboard a fleet-based
    Chapter's flagship.
  category: institutions
  sources: [lex-fortress-monastery]
  full_treatment: II.T3.Ch7

kasr:
  term: Kasr
  definition: >
    A Cadian city — a fortress in its own right, void-shielded, ringed by earthworks and gun
    emplacements and separated from the outside by a moat.
  variants: [Kasrs]
  category: warfare
  sources: [lex-cadia]

law-of-decipherability:
  term: the Law of Decipherability
  definition: >
    The Cadian statute under which graves whose tombstones had become illegible were exhumed
    and the bones added to a communal pit, the obligation to honour a name lapsing with the
    name itself.
  category: institutions
  sources: [lex-cadia]

death-world:
  term: Death World
  definition: >
    A δτ-class world classified by extremely dangerous native flora and fauna. Inhabited death
    worlds may pay their tithe in Deathworld Veteran Regiments.
  variants: [Deathworld, δτ-class]
  category: cosmology
  sources: [lex-death-world]
  full_treatment: II.T3.Ch9

in-articulo-mortis:
  term: In Articulo Mortis
  definition: >
    "At the moment of demise" — the phrase some Imperial ledgers use for a death world.
    Caliban was so recorded before its destruction.
  category: institutions
  sources: [lex-death-world]

the-purging:
  term: the Purging
  definition: >
    Colonel Jurten's atomic cleansing of Krieg in 433.M40, which ended the planet's civil war
    by rendering its surface uninhabitable and founded the culture of the Death Korps.
  category: warfare
  sources: [lex-krieg]

vitae-womb:
  term: the Vitae Womb
  definition: >
    The system by which much of Krieg's population growth is now undertaken, the surface being
    uninhabitable.
  category: technology
  sources: [lex-krieg]

illmaea:
  term: the Illmaea
  definition: >
    Commorragh's "stolen suns" — stars drawn out of realspace into Webway sub-realms before the
    Fall to power the city, killing the systems they were taken from.
  category: cosmology
  sources: [lex-commorragh]

tomb-world:
  term: Tomb World
  definition: >
    A world holding dormant Necrons, graded crownworld, coreworld or fringeworld. Only a tiny
    portion have been found, and the true number is known to no one but the Necrons.
  category: cosmology
  sources: [lex-tomb-world]

deep-spirit:
  term: Deep Spirit
  definition: >
    The master control programme that runs a Tomb World in the absence of an active Necron
    population, directing its Canoptek constructs.
  category: technology
  sources: [lex-tomb-world]

montau:
  term: the Mont'au
  definition: >
    The T'au's darkest age, at the end of M37, when inter-tribal war and plague brought the
    species to the verge of self-extinction — ended by the Ethereals at Fio'taun.
  category: cosmology
  sources: [lex-t-au-empire]

sphere-of-expansion:
  term: Sphere of Expansion
  definition: >
    A phase of T'au growth in which nearby worlds are colonised, conquered, or persuaded to
    join the Greater Good — a negotiation that may run for decades before the Fire Caste is used.
  variants: [Spheres]
  category: institutions
  sources: [lex-t-au-empire]

gue-vesa:
  term: Gue'vesa
  definition: >
    Humans within the T'au Empire, from ideological defectors to captured guardsmen and their
    children. The Empire claims they are content and permitted to worship the Emperor.
  category: institutions
  sources: [lex-t-au-empire]

# --- Terms the prose used across Chapters without defining -----------------
# Added after the validator began reporting bolded named terms that no registry
# defines. Each definition is drawn from a source the prose already rests on.

forge-world:
  term: Forge World
  definition: >
    A Φ-class world of the Adeptus Mechanicus, given over entirely to industry and to
    the Cult Mechanicus's own worship. Most of the surface is built-up industrial
    complex, and each is assigned a Production Grade it is expected to meet.
  variants: [Φ-class, forge world]
  category: cosmology
  sources: [lex-forge-world]
  full_treatment: II.T2.Ch5

tech-priest:
  term: Tech-Priest
  definition: >
    A member of the ruling order of the Cult Mechanicus, ranking above the unaugmented
    menials and the Skitarii in a society that sorts its members by how much of the body
    has been replaced.
  variants: [Tech-Priests, tech-priest]
  category: institutions
  sources: [lex-mars]

tau:
  term: T'au
  definition: >
    The species that founded and leads the T'au Empire, organised into castes under the
    Ethereals and united by the Greater Good.
  variants: [Tau]
  category: xenos
  sources: [lex-t-au-empire]

ecclesiarchy:
  term: Ecclesiarchy
  definition: >
    Officially the Adeptus Ministorum: the hierarchy of the Imperial Cult, which
    maintains and spreads the Imperial Creed, the Imperium's only official religion.
    Serious deviance from its strictures is treated as heresy.
  variants: [Adeptus Ministorum, Ministorum]
  category: institutions
  sources: [lex-ecclesiarchy]

tyranids:
  term: Tyranids
  definition: >
    An extragalactic species, also called the Great Devourer, whose purpose is the
    consumption of all genetic and biological material. Their technology is entirely
    biological, every function carried out by engineered creatures directed by a single
    Hive Mind.
  variants: [Tyranid, the Great Devourer]
  category: xenos
  sources: [lex-tyranid]

conduit:
  term: the Conduit
  definition: >
    The centre of Imperial transgalactic communication, housed within the City of Sight
    on Terra — the single point through which astropathic traffic passes.
  category: institutions
  sources: [lex-terra]

castellan:
  term: the Castellan
  definition: >
    The senior Inquisitor overseeing the Fortress of the Inquisition on Terra. The post
    changes every year, so that no single person can build a powerbase over the facility.
  category: institutions
  sources: [lex-terra]

librarium:
  term: Librarium
  definition: >
    A fortress-monastery's record repository and seat of communications, where the
    Chapter's astropaths work and from whose armoured room the base's defences are
    controlled.
  category: institutions
  sources: [lex-fortress-monastery]

# --- Volume III Title 1 ----------------------------------------------------

the-deceiver:
  term: the Deceiver
  definition: >
    The C'tan that approached Szarekh with the offer of immortality in exchange for the
    Necrontyr's organic forms, claiming its own race had fought and lost to the Old
    Ones — a claim the sources do not verify.
  variants: [Mephet'ran]
  category: cosmology
  sources: [lex-biotransference, lex-war-in-heaven-necron]

halo-stars:
  term: the Halo Stars
  definition: >
    The region at the galaxy's edge to which the Necrontyr were driven after losing the
    first phase of the War in Heaven, and where their hatred generalised from the Old Ones
    to all life.
  category: cosmology
  sources: [lex-war-in-heaven-necron, lex-necrontyr]

solar-gods:
  term: the Solar Gods
  definition: >
    The pantheon the Necrontyr worshipped before they encountered the C'tan — whose
    half-forgotten forms the first Necrontyr to find the star gods gave them.
  category: cosmology
  sources: [lex-necrontyr, lex-war-in-heaven-necron]

# --- Volume III Title 2 ----------------------------------------------------

abhuman:
  term: Abhuman
  definition: >
    A human strain that diverged during the Age of Strife, adapting over millennia of
    isolation to its world's conditions — the Ratlings, Ogryns and Squats among them.
  variants: [abhuman, Abhumans]
  category: institutions
  sources: [lex-age-of-strife]

ratling:
  term: Ratlings
  definition: >
    An abhuman strain stunted by thousands of years of inbreeding on worlds whose climates
    were even more conducive to human life than ancient Terra's.
  variants: [Ratling]
  category: institutions
  sources: [lex-age-of-strife]

ogryn:
  term: Ogryns
  definition: >
    An abhuman strain evolved on harsh, cold and barren worlds, and correspondingly large
    and strong.
  variants: [Ogryn]
  category: institutions
  sources: [lex-age-of-strife]

squat:
  term: Squats
  definition: >
    An abhuman strain from the barren high-gravity worlds towards the galactic core, whose
    homeworlds formed one of the pocket empires that survived Old Night.
  variants: [Squat]
  category: institutions
  sources: [lex-age-of-strife]

leagues-of-votann:
  term: the Leagues of Votann
  definition: >
    A civilisation descended from Dark Age mining fleets sent to the Galactic Core, which
    kept a large number of STCs — and, unlike the Imperium, improves on their designs.
  variants: [Kin, Votann]
  category: institutions
  sources: [lex-dark-age-of-technology, lex-standard-template-construct]

# --- Volume III Title 3 ----------------------------------------------------

dead-world:
  term: Dead World
  definition: >
    A world whose population has been extinguished, whether by war, virus-bombing or cyclonic
    torpedo. Davin's classification after three loyal Primarchs sterilised it.
  category: cosmology
  sources: [lex-davin]

dysjunction:
  term: Dysjunction
  definition: >
    The catastrophic destabilisation of Commorragh caused by the partial awakening of Ynnead,
    which opened Khaine's Gate and let daemons into the Dark City.
  category: cosmology
  sources: [lex-commorragh]

malcador:
  term: Malcador the Sigillite
  definition: >
    The Emperor's first minister, head of the Council of Terra, who took the Golden Throne while
    the Emperor fought Horus and died doing it. He claimed the Primarchs were meant to purge each
    other, and would not confirm whether he meant it.
  variants: [Malcador, Malcador the Sigilite, the Sigillite]
  category: institutions
  sources: [lex-primarch, lex-golden-throne]

nurgle:
  term: Nurgle
  definition: >
    One of the four great powers of Chaos, whose domain is decay and disease. Its blade wounded
    Horus on Davin's Moon and its influence rotted that moon's ecosystem.
  variants: [Nurg-leth]
  category: cosmology
  sources: [lex-davin]

# --- Volume III Titles 4-5 -------------------------------------------------

legio-cybernetica:
  term: Legio Cybernetica
  definition: >
    A Mechanicum formation of battle-automata that fought throughout the Great Crusade and the
    Indomitus Crusade alike — an institution whose name announces exactly what the Imperium's ban
    on artificial intelligence was supposed to forbid.
  category: institutions
  sources: [lex-great-crusade, lex-indomitus-crusade]

skitarii:
  term: Skitarii
  definition: >
    The Adeptus Mechanicus's soldiery, ranking above the unaugmented menials and below the
    Tech-Priests. Joining them is how a Martian citizen receives their first bionics.
  category: institutions
  sources: [lex-mars]

officio-assassinorum:
  term: the Officio Assassinorum
  mark: [Grand Master of Assassins]
  definition: >
    The Imperium's institution of sanctioned murder, based on Terra with its temples' locations
    kept secret. It failed to kill the Voice of the Emperor during the Age of Apostasy.
  category: institutions
  sources: [lex-terra, lex-age-of-apostasy]

ecclesiarch:
  term: the Ecclesiarch
  definition: >
    Head of the Adeptus Ministorum, and by tradition always one of the High Lords of Terra.
    The Ecclesiarchy is not part of the Adeptus Terra but a wholly separate organisation.
  variants: [Ecclesiarch of the Adeptus Ministorum]
  category: institution
  sources: [lex-ecclesiarchy]
  full_treatment: IV.T3.Ch8

cardinal:
  term: Cardinal
  definition: >
    The rank below the Ecclesiarch, several thousand strong. Each heads a diocese —
    generally an entire Imperial world — and collectively the Cardinals form the Holy
    Synod, the Ministorum's ruling body.
  variants: [Cardinals, Holy Synod, Cardinal World]
  category: rank
  sources: [lex-ecclesiarchy]
  full_treatment: IV.T3.Ch8

adeptus-terra:
  term: the Adeptus Terra
  definition: >
    The collective priesthood of Terra — the departments that administer the Imperium from
    the Throneworld, of which the Administratum is by far the largest. The Ecclesiarchy is
    deliberately not part of it.
  variants: [Priesthood of Terra]
  category: institution
  sources: [lex-adeptus-terra]
  full_treatment: IV.T1.Ch2

hive:
  term: Hive
  definition: >
    A huge urban accretion built up over thousands of years, its peaks called spires and
    its lowest layers the underhive. Over 85% of Imperial planets carry at least one
    hive city cluster.
  mark: [hive, hives]   # lowercase "hive" is ordinary usage in the prose and in the
                        # sources, and means exactly the same thing.
  variants: [hive city, hive cluster, city hive]
  category: institutions
  sources: [lex-hive]
  full_treatment: IV.T2.Ch4

inquisitor:
  term: Inquisitor
  definition: >
    An agent of the Inquisition, answerable to no Imperial authority below the High Lords
    and empowered by the Inquisitorial rosette to commandeer any Imperial resource.
  variants: [Inquisitors, Lord Inquisitor]
  category: rank
  sources: [lex-officio-assassinorum]
  full_treatment: IV.T7.Ch23
