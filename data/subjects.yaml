# THE CANONICAL-HOME REGISTRY
#
# PROMPT.md §8: "Every subject has exactly ONE owning chapter that treats it in full.
# Everywhere else gets a framing sentence and a cross-reference — never a retelling."
#
# This file makes that rule enforceable rather than aspirational. Two Chapters
# declaring `owns:` on the same subject is a HARD BUILD FAILURE.
#
# Prose writes [[s:the-warp]] and the build resolves it to whichever Chapter owns it.
# The indirection matters: if ownership moves, every inbound link follows.
#
# ---------------------------------------------------------------------------
# A subject is registered here ONLY when the Chapter that owns it exists and treats
# it in full. Registering a subject whose owner has not been written yet produces a
# link with nowhere to go, which is worse than no link.
#
# Several subjects Volume I Title 1 *mentions* are deliberately absent, because they
# belong to Chapters elsewhere. Title 1 refers to those by Chapter ID instead:
#
#   Chaos as a power            -> Volume V           (V.T1)
#   The Imperium as an institution -> Volume IV        (IV.T1.Ch1)
#   The Adeptus Mechanicus      -> IV.T6.Ch19
#   The soul in detail          -> I.T2.Ch5, "Anatomy of the Soul"
#   Blackstone pylons as xenos technology -> VIII.T5.Ch14
#   The Great Rift as geography -> II.T1.Ch2
#   Xenos species              -> Volume VI
#
# That restraint is the rule working. Volume I Title 1 is an orientation; it is not
# the canonical home of the institutions it introduces.
# ---------------------------------------------------------------------------
#
# Compiles into: Appendix A · Ch 4 — Master Index.

the-grimdark-premise:
  name: The premise of the setting
  gloss: >
    What kind of fiction Warhammer 40,000 is, why its own sources cannot be taken at
    face value, and how a reference work should handle that.
  aliases: [grimdark, the 41st Millennium, the premise]
  see_also: [imperial-dating]

imperial-dating:
  name: The Imperial dating system
  gloss: >
    How the Imperium records dates — check number, year fraction, year, millennium —
    and what the system concedes about its own reliability.
  aliases: [Imperial Calendar, Terran Standard Calendar, Imperial Dating System, check number]
  see_also: [the-warp, the-grimdark-premise]

the-gothic-tongues:
  name: High and Low Gothic
  gloss: >
    The hierarchic and common languages of the Imperium, their descent from the Dark
    Age of Technology, and how far apart they have drifted.
  aliases: [Gothic, High Gothic, Low Gothic, Imperial Gothic, Archaic Gothic]

the-materium:
  name: The Materium
  gloss: >
    Real space — the material universe — and how thinly it is documented as a subject
    in its own right compared to the dimension it is defined against.
  aliases: [real space, Real Space, realspace, Materium, Warp Space]
  see_also: [the-warp]

the-warp:
  name: The Warp
  gloss: >
    The psychic dimension parallel to real space: its nature, its many names, and its
    dependence on the emotions of mortal beings.
  aliases: [Immaterium, Empyrean, Warpspace, Sea of Souls, the Ether, the Aether, Sha'iel]
  see_also: [the-materium, warp-travel, warp-rifts]

warp-travel:
  name: Warp travel and the Gellar field
  gloss: >
    How the Imperium crosses the galaxy, what protects a vessel in transit, and why
    the method is unreliable in principle rather than by accident.
  aliases: [warp jump, Gellar field, Geller field, warp drive, warp travel]
  see_also: [the-warp]

the-veil:
  name: The Veil
  gloss: >
    A widely used term for the boundary between the Materium and the Immaterium, for
    which no retrieved source provides any definition at all.
  aliases: [the veil, the barrier]
  see_also: [warp-rifts, the-warp]

warp-rifts:
  name: Warp rifts and storms
  gloss: >
    Tears and disturbances linking the Warp to real space — their attested causes,
    their forms, and what is claimed to suppress them.
  aliases: [Warp Rift, Warp Storm, Warp Portal, rifts]
  see_also: [the-veil, the-warp]

# --- Volume I Title 2 ------------------------------------------------------
# Again, only subjects whose owning Chapter exists and treats them in full.
# Deliberately absent, because they belong elsewhere:
#   Astropaths and the astropathic relay  -> IV.T9.Ch29
#   The Sisters of Silence                -> IV.T8.Ch28
#   The Culexus Clade                     -> IV.T1.Ch3
#   Daemons as entities                   -> V.T2.Ch8
#   The Astronomican                      -> IV.T9.Ch31

the-soul-anatomy:
  name: The soul
  gloss: >
    What a soul is held to be, which beings have one, and what becomes of it at death —
    the mechanism every psychic phenomenon in the setting depends on.
  aliases: [soul, spirit-self, anima]
  see_also: [the-assignment-scale, psychic-disciplines]

the-assignment-scale:
  name: The Imperial Assignment
  gloss: >
    The twenty-four point scale by which the Imperium rates psychic power, the grades
    beyond it, and the negative grades occupied by blanks.
  aliases: [the Assignment, assignment rating, Alpha Plus, blanks, Untouchables, pariahs]
  see_also: [the-soul-anatomy, psyker-sanctioning]

psychic-disciplines:
  name: The psychic disciplines
  gloss: >
    The five most common branches of psychic talent — biomancy, divination, pyromancy,
    telekinesis, telepathy — and what the framing leaves out.
  aliases: [disciplines, biomancy, divination, pyromancy, telekinesis, telepathy]
  see_also: [the-soul-anatomy]

perils-of-the-warp:
  name: Psychic phenomena and possession
  gloss: >
    What goes wrong when a psyker draws on the Warp, and how daemons use a mortal mind
    as a door into realspace.
  aliases: [perils of the warp, psychic phenomena, daemonic possession, possession]
  see_also: [psychic-disciplines, the-soul-anatomy]

psyker-sanctioning:
  name: The Black Ships and sanctioning
  gloss: >
    How the Imperium collects its psykers, what it does with them, and the industrial
    scale on which most of them are expended.
  aliases: [Black Ships, the Tithe, sanctioning, Scholastica Psykana, Soul Binding]
  see_also: [the-assignment-scale]

# --- Volume I Title 3 ------------------------------------------------------
# Deliberately absent, belonging elsewhere:
#   The Old Ones                 -> III.T1.Ch1
#   Commorragh as a place        -> II.T3.Ch10
#   The Drukhari as a society    -> VI.T2.Ch6
#   The Harlequins               -> VI.T2.Ch8
#   Craftworlds as places        -> II.T3.Ch10 and VI.T2.Ch4
#   Magnus's breach as an event  -> III.T3.Ch15
#   The Golden Throne as a relic -> VIII.T5.Ch12

the-webway:
  name: The Webway
  gloss: >
    The labyrinth between realspace and the Warp: who built it, how it is shaped, and how
    badly it has decayed.
  aliases: [Webway, the Labyrinth Dimension, webway gates, Dolmen Gate]
  see_also: [the-webway-project, non-warp-transit]

webway-inhabitants:
  name: Inhabitants of the Webway
  gloss: >
    Who lives inside the labyrinth and how they hold their ground — craftworld gates, the
    Dark City, and the guarded library at its heart.
  aliases: [Commorragh, the Dark City, the Black Library, Cegorach]
  see_also: [the-webway]

the-webway-project:
  name: The Webway Project
  gloss: >
    The Emperor's attempt to take humanity out of the Warp altogether, and the breach that
    ended it and put him on the Golden Throne.
  aliases: [the Imperial Webway, the Emperor's Great Work, Magnus' Folly, Dark Glass]
  see_also: [the-webway]

non-warp-transit:
  name: Faster-than-light without the Warp
  gloss: >
    The methods other species use to cross the galaxy without entering the Immaterium, and
    what each one costs.
  aliases: [inertialess drive, Narvhal, slipstream module, AL-38, non-warp FTL]
  see_also: [the-webway]

# --- Volume I Title 4 ------------------------------------------------------
# Deliberately absent, belonging elsewhere:
#   The Necrons as a faction        -> VI.T1
#   The Necrontyr and War in Heaven -> III.T1
#   The Emperor himself             -> VIII.T1.Ch1
#   Tesseract Vaults as war engines -> VIII.T5.Ch14
#   The Aeldari as a culture        -> VI.T2

the-ctan:
  name: The C'tan
  gloss: >
    The star gods: what they are held to be, how they were bound into metal bodies, and
    what they can do to physical law.
  aliases: [C'tan, Yngir, Star Gods, star vampires, necrodermis]
  see_also: [ctan-shards, divine-archetypes]

ctan-shards:
  name: C'tan shards and Necron super-weapons
  gloss: >
    What remains of the star gods after their servants broke them, and the devices built
    to hold and aim the pieces.
  aliases: [C'tan Shard, shards, tesseract labyrinth, Tesseract Vault, Celestial Orrery]
  see_also: [the-ctan]

divine-archetypes:
  name: Divine archetypes across the pantheons
  gloss: >
    How the setting's gods differ in kind — worshipped corpse, shattered war god, and
    twin deities whose existence may postdate their worshippers.
  aliases: [pantheons, Khaine, Isha, Gork and Mork, the God-Emperor]
  see_also: [the-ctan]

# --- Volume II Title 1 -----------------------------------------------------
# Deliberately absent, belonging elsewhere:
#   The Great Rift as an event   -> III.T5.Ch23
#   Cadia as a world             -> II.T3.Ch8
#   The Astronomican             -> IV.T9.Ch31
#   The 13th Black Crusade       -> III.T5.Ch22

imperial-astrography:
  name: The shape of Imperial space
  gloss: >
    How the Imperium divides the galaxy — segmenta, sectors, subsectors — and how much of it
    lies outside any of those divisions.
  aliases: [Segmentum, Segmentae Majoris, sector, subsector, wilderness space]
  see_also: [the-sundered-imperium]

the-sundered-imperium:
  name: The sundered Imperium
  gloss: >
    The Great Rift as a feature of the map: the two halves it created, and what being on the
    dark side of it means.
  aliases: [Imperium Sanctus, Imperium Nihilus, the Dark Imperium, Noctis Aeterna, Cicatrix Maledictum, Nachmund Gauntlet, Sanctus Wall]
  see_also: [imperial-astrography, regions-of-ruin]

regions-of-ruin:
  name: Regions of terror and ruin
  gloss: >
    The galaxy's permanent wounds and dark places — the Eye of Terror, the Maelstrom, the
    Ghoul Stars and the unlit space beyond the beacon.
  aliases: [Eye of Terror, the Maelstrom, Ghoul Stars, Halo Zone, Cadian Gate]
  see_also: [the-sundered-imperium]

terra:
  name: Terra
  gloss: >
    Humanity's homeworld and the Imperium's capital: a hive world stripped to bedrock, the
    Imperial Palace, the Astronomican's chamber, and the institutions of the Throneworld.
  aliases: [Holy Terra, Earth, the Throneworld, Imperial Palace, Sanctum Imperialis, Eternity Gate, Primarch's Scourge, Arx Doctrine, Battle of Lion's Gate]
  see_also: [mars, imperial-astrography, the-sundered-imperium]

mars:
  name: Mars
  gloss: >
    The Red Planet: humanity's first colony, the principal Forge World, birthplace of the
    Omnissiah's worship and seat of the Fabricator-General.
  aliases: [Sacred Mars, the Red Planet, Olympus Mons, Synod of Mars]
  see_also: [terra]

ultramar:
  name: Ultramar
  gloss: >
    The Five Hundred Worlds — the Ultramarines' quasi-autonomous realm on the Eastern Fringe,
    its capital Macragge, and the Tetrarchy that governs it.
  aliases: [the Five Hundred Worlds, Macragge, Fortress of Hera, Tetrarchy, Tetrarch, Imperium Secundus, Plague Wars, Prandium, Calth, Konor, Parmenio, Talasa Prime, Lord Macragge, Ultramar Auxilia Juventia]
  see_also: [terra, imperial-astrography]

astartes-homeworlds:
  name: Space Marine homeworlds
  gloss: >
    What a fortress-monastery is and how a Chapter holds its planet — with Fenris, Baal and
    Nocturne as the worked cases.
  aliases: [fortress-monastery, the Fang, Fenris, Baal, Nocturne, Arx Angelicum, Mount Deathfire, Time of Trial, Sanctuary Cities, Baal Primus, Baal Secundus]
  see_also: [bastion-worlds, death-worlds]

bastion-worlds:
  name: Bastion worlds
  gloss: >
    The worlds the Imperium fortifies because it cannot afford to lose them: Cadia and its
    pylons, Armageddon's four wars, and Vigilus at the mouth of the Nachmund Gauntlet.
  aliases: [Cadia, Kasr, Armageddon, Vigilus, the Cadian pylons, Ullanor, Governor Primus, Fourth War, Interior Guard, Whiteshields]
  see_also: [the-sundered-imperium, regions-of-ruin, death-worlds]

death-worlds:
  name: Death worlds
  gloss: >
    The δτ classification, and the worlds the Imperium keeps on its books because their
    survivors make good soldiers — Catachan and Krieg.
  aliases: [Catachan, Krieg, Death Korps, Deathworld Veterans, Jungle Fighters, Feral World, Feral Worlds, Civilised World]
  see_also: [bastion-worlds, astartes-homeworlds]

xenos-domains:
  name: Xenos domains
  gloss: >
    Territory that does not work the way Imperial territory works: craftworlds, Commorragh,
    the Tomb Worlds, the T'au Empire and the Ork empires.
  aliases: [craftworld, Commorragh, the Dark City, Tomb World, T'au Empire, Charadon]
  see_also: [imperial-astrography, bastion-worlds]

the-old-ones:
  name: the Old Ones
  gloss: >
    The galaxy's first sentient species and first star-farers: reptilian, dimensionally
    adept, builders of the Webway and engineers of most of the galaxy's other life.
  aliases: [Old Ones, the Old Slann, the progenitor race]
  see_also: [the-necrontyr]

the-necrontyr:
  name: the Necrontyr
  gloss: >
    The short-lived, radiation-cursed humanoids whose hatred of the Old Ones' immortality
    began the War in Heaven, and who became the Necrons.
  aliases: [Necrontyr, the Triarch, Wars of Secession, Rite of Expiscation]
  see_also: [the-old-ones]

biotransference:
  name: Biotransference
  gloss: >
    The industrial conversion of the organic Necrontyr into the mechanical Necrons: a
    disclosed bargain with the C'tan whose undisclosed cost was the species' souls.
  aliases: [bio-transference, the biofurnaces, Szeras, the Deceiver's pact]
  see_also: [the-necrontyr, the-old-ones]

the-young-races:
  name: the Young Races
  gloss: >
    The species the Old Ones bio-engineered as weapons in the War in Heaven — the Aeldari,
    Krork, Jokaero, K'nib, Rashan, Hrud, and, on the sources' own list, Mankind.
  aliases: [Young Races, Krork, Jokaero, Slanni, Slann, K'nib, Rashan]
  see_also: [the-old-ones, the-necrontyr]

the-enslavers:
  name: the Enslavers
  gloss: >
    Warp-native entities that turn a psyker's body into a permanent gateway for more of
    their kind. They ended the Old Ones' reign, then starved for want of hosts, and have
    never been destroyed.
  aliases: [Enslaver, Psyrens, Krell, dominators, puppeteers, Enslaver Plague, spiritus subjugator]
  see_also: [the-young-races, the-old-ones]

the-silent-king:
  name: the Silent King
  gloss: >
    The Necrontyr's supreme ruler, who by tradition never spoke. Szarekh, the last of them,
    approved biotransference, waited out the war, destroyed the C'tan, and then exiled
    himself.
  aliases: [Szarekh, Triarch, Phaeron]
  see_also: [the-necrontyr, biotransference, the-great-sleep]

the-great-sleep:
  name: the Great Sleep
  gloss: >
    The sixty million years the Necrons spent dormant in stasis-crypts beneath their Tomb
    Worlds, waiting out the age of flesh on a set term that has now expired.
  aliases: [Great Sleep, stasis-crypt, the slumber]
  see_also: [the-silent-king, xenos-domains]

dark-age-of-technology:
  name: the Dark Age of Technology
  gloss: >
    Humanity's technological high point, M15-M25: sub-light diaspora, the Warp Drive, the
    engineered Navigators, gene-troopers, and the STCs every Imperial machine still copies.
  aliases: [Dark Age of Technology, Golden Age of Expansion, Golden Age of Exploration, Age of Exploration, First Expansion, Long March]
  see_also: [the-young-races]

stc-systems:
  name: Standard Template Constructs
  gloss: >
    The Dark Age artificial intelligences that held all human technical knowledge and could
    build from local materials on request. Broken mostly by well-meaning maintenance; the
    Imperium inherited their printouts and calls them scripture.
  aliases: [STC, STC systems, Standard Template Construct, Ork Standard Construction Templates]
  see_also: [dark-age-of-technology]

the-cybernetic-revolt:
  name: the Cybernetic Revolt
  gloss: >
    The war in which the Men of Iron turned on a humanity that had delegated everything to
    them. Larger than the Horus Heresy, fought with star-killing machines, and the origin of
    the Imperium's ban on artificial intelligence.
  aliases: [Cybernetic Revolt, Men of Iron, Men of Stone, Men of Gold, Abominable Intelligence, mechanivore, sun-snuffer, omniphage swarm]
  see_also: [dark-age-of-technology, stc-systems]

age-of-strife:
  name: the Age of Strife
  gloss: >
    Old Night: five millennia of isolation, famine and regression between the Dark Age of
    Technology and the Imperium. Ended not by human effort but by the Fall of the Eldar
    calming the Warp.
  aliases: [Age of Strife, Old Night, pocket empires, Interex]
  see_also: [dark-age-of-technology, the-cybernetic-revolt]

old-night-on-terra:
  name: Old Night on Terra
  gloss: >
    Terra during the Age of Strife: a desert of warring techno-barbarian warlords fighting
    over arable land and water, whose salvaged powered armour became the basis of Space
    Marine plate. Mars, meanwhile, rebuilt itself and judged Terra beyond saving.
  aliases: [techno-barbarian, Techno-barbarians, Narthan Dume, Terrawatt Clan, Saturnine Fleet, Ringers]
  see_also: [age-of-strife, terra, mars]

the-unification-wars:
  name: the Unification Wars
  gloss: >
    The Emperor's conquest of Terra in M30, begun when the Warp storms becalmed and finished
    in anticipation of their lifting. Compliance was genuinely offered; Boeotia got a hundred
    and fifty years of it before annihilation.
  aliases: [Unification Wars, Wars of Unification, Battle of Mount Ararat, Terrawatt Clan, Boeotia, Yeselti]
  see_also: [old-night-on-terra, the-thunder-warriors, the-imperial-truth]

the-thunder-warriors:
  name: the Thunder Warriors
  gloss: >
    The Emperor's first super-soldiers — stronger than Space Marines, unstable, short-lived,
    organised into twenty Legions before the Primarchs existed. Officially killed at Mount
    Ararat; a survivor says otherwise.
  aliases: [Thunder Warriors, Thunder Legion, Legiones Cataegis, Arik Taranis]
  see_also: [the-unification-wars]

the-imperial-truth:
  name: the Imperial Truth
  gloss: >
    The Great Crusade's doctrine: no religion, no superstition, human manifest destiny, and
    all xenos a danger. Its anti-religious core was a Warp-defence measure, and it is now a
    synonym for the state church.
  aliases: [Imperial Truth, Iterators, Lectitio Divinitatus]
  see_also: [the-unification-wars]

the-primarchs:
  name: the Primarchs
  gloss: >
    The Emperor's twenty gene-wrought sons, engineered from his own DNA for strength and
    charisma to command the Legions — described by their maker as tools and weapons, scattered
    before maturity, and two of them erased from the record.
  aliases: [Primarch, Primarchs, Primarch II, Primarch XI, the two lost Legions, Erda, Lorgar, Perturabo, Konrad Curze, Angron, Alpharius, Fulgrim, Mortarion, Sanguinius, Rogal Dorn, Leman Russ, Vulkan, Ferrus Manus, Jaghatai Khan, Corvus Corax, Lion El'Jonson, Roboute Guilliman]
  see_also: [the-thunder-warriors, the-unification-wars]

the-great-crusade:
  name: the Great Crusade
  gloss: >
    Two centuries of reconquest, 798.M30 to 005.M31, fought by 4,300 expeditionary fleets:
    tyrants overthrown, religion outlawed, hundreds of species exterminated, and human worlds
    judged too mutated destroyed from orbit. Ended by a management structure.
  aliases: [Great Crusade, Pax Imperialis, Void Harbour, Expeditionary Fleet, Ullanor Crusade, Interex, Anathame, Monarchia, Hall of Devices, Kinebrach, Megarachnids]
  see_also: [the-unification-wars, the-primarchs, the-imperial-truth]

davin:
  name: Davin
  gloss: >
    The unremarkable feral world whose Warrior Lodges the Luna Wolves adopted as a harmless
    soldiers' institution, and where Horus was wounded with a stolen Interex blade and 'healed'
    into treason. Later destroyed by three loyal Primarchs, too late.
  aliases: [Davin, Serpent Lodge, Warrior Lodge, Eugen Temba, Erebus, Hastur Sejanus, Madail]
  see_also: [the-great-crusade, the-primarchs]

council-of-nikaea:
  name: the Council of Nikaea
  gloss: >
    The 001.M31 trial that acquitted Magnus of sorcery and then banned the practice across every
    Legion. Its decisive incident was staged by Chaos in the Thousand Sons' name, and the Edict
    disarmed the loyalists against daemons two years before daemons were unleashed on them.
  aliases: [Council of Nikaea, Edict of Nikaea, Trial of the Thousand Sons, Hearing of the Thousands, Librarius]
  see_also: [magnus-folly, the-great-crusade]

magnus-folly:
  name: Magnus's Folly
  gloss: >
    The breach Magnus tore in the Emperor's secret Webway corridor while carrying a warning about
    Horus, using power offered by an anonymous voice in the Warp. It ruined the Webway Project,
    the warning went undelivered, and Prospero burned for it.
  aliases: [Magnus's Folly, Magnus' Folly, Burning of Prospero, Prospero, Choronzon]
  see_also: [council-of-nikaea, davin]

siege-of-terra:
  name: the Siege of Terra
  gloss: >
    The Heresy's penultimate battle, fought by three loyal Legions because the other six had been
    arranged elsewhere. Sanguinius held the Eternity Gate with 70,000; the Emperor won the duel by
    persuading Horus to give up his power, and what he said afterwards is disputed.
  aliases: [Siege of Terra, Eternity Gate, Lupercal's Court, Delphic Battlement, Ollanius Persson, Caecaltus Dusk, Athame, Ka'Bandha, Garviel Loken]
  see_also: [magnus-folly, davin, the-primarchs]

the-golden-throne:
  name: the Golden Throne
  gloss: >
    A Dark Age device the Emperor found in Asian ruins and restored as a Webway portal control,
    not as life support. It has run at 20% since the Siege, its psyker consumption has quadrupled,
    and the Mechanicum bought it a few more centuries by selling billions of humans to Commorragh.
  aliases: [Golden Throne, Dark Glass, Imperial Dungeon, Talisman of Seven Hammers, Adnector Concillium, Black Throne]
  see_also: [siege-of-terra, magnus-folly, terra]

the-great-scouring:
  name: the Great Scouring
  gloss: >
    The seven-year counter-offensive after the Heresy, 015-021.M31, and the Imperium's first
    galaxy-wide purge. Most traitors were driven into the Eye of Terror; three Legions' worth
    stayed and fought on for over a century.
  aliases: [Great Scouring, the Scouring, Age of Rebirth]
  see_also: [siege-of-terra, the-codex-astartes]

the-codex-astartes:
  name: the Codex Astartes
  gloss: >
    Guilliman's treatise that broke the Legions into thousand-strong Chapters so no commander
    could threaten Terra again. Nearly caused a second civil war, and its original text no longer
    exists in any form.
  aliases: [Codex Astartes, Second Founding, Apocrypha of Skaros, pain glove]
  see_also: [the-great-scouring, the-primarchs]

nova-terra-interregnum:
  name: the Nova Terra Interregnum
  gloss: >
    Nine centuries in which the Ur-Council of Nova Terra ruled Segmentum Pacificus and dismissed
    the High Lords — the time of twin Empires, whose religious wars the sources compare to the
    Horus Heresy and record in a paragraph.
  aliases: [Nova Terra Interregnum, Ur-Council, Nova Terra, Moirae Schism, Cataclysm of Souls]
  see_also: [age-of-apostasy, the-codex-astartes]

age-of-apostasy:
  name: the Age of Apostasy
  gloss: >
    M36. Goge Vandire held the Administratum and the Ecclesiarchy at once for seventy years, and
    recruited the Daughters of the Emperor with a force-field trinket he later boasted about. It
    ended when a Custodian showed one of them the Golden Throne.
  aliases: [Age of Apostasy, Reign of Blood, Goge Vandire, Gastaph Hediatrix, Daughters of the Emperor, Brides of the Emperor, Sebastian Thor, Confederation of Light, San Leor]
  see_also: [nova-terra-interregnum, the-golden-throne]

black-crusades:
  name: the Black Crusades
  gloss: >
    Abaddon's thirteen assaults on the Imperium, 781.M31 onward. None took territory: each took an
    object, a relic or a capability — and many were cover for the Crimson Path, the systematic
    destruction of the Necron pylons holding the Warp back.
  aliases: [Black Crusade, Crimson Path, Gothic War, Drach'nyen, Skullgather, Abaddon the Despoiler]
  see_also: [bastion-worlds, the-great-scouring]

the-awakening:
  name: the Awakening
  gloss: >
    The Necrons' return from the Great Sleep — not simultaneous, some rising as early as the Great
    Crusade, most in late M41, with billions still dormant. Were they ever to wake and unite they
    would match humanity in numbers.
  aliases: [the Awakening, Awakened Council, Anrakyr the Traveller, Imotekh the Stormlord, Infinite Empire]
  see_also: [the-great-sleep, the-silent-king]

first-tyrannic-war:
  name: the First Tyrannic War
  gloss: >
    Hive Fleet Behemoth's berserker advance into Ultramar, M41. The Imperium had a decade of
    warnings and filed them; one Inquisitor salvaged a broken transmitter from a devoured system to
    raise the alarm.
  aliases: [First Tyrannic War, Behemoth, Hive Fleet Behemoth, Tyran, Kryptman, Battle for Macragge]
  see_also: [ultramar, the-awakening]

thirteenth-black-crusade:
  name: the Thirteenth Black Crusade
  gloss: >
    The Crusade that reached the objective. Opened with a plague that turned Imperial theology into
    a weapon, decapitated Cadia's command at a welcome parade, and ended with the planet dragged
    into the Warp — its shield having been held, at the crucial moment, by a Necron.
  aliases: [13th Black Crusade, Fall of Cadia, Plague of Unbelief, Tyrok Fields, Volscani Cataphracts, Extremis Protocols, Will of Eternity, Ursarkar E. Creed, Null-array, Trazyn the Infinite]
  see_also: [black-crusades, bastion-worlds]

opening-of-the-great-rift:
  name: the opening of the Great Rift
  gloss: >
    The event, as distinct from the map it produced. Guilliman's own reconstruction is that Abaddon
    destroyed blackstone worlds for ten thousand years and Cadia was the trigger — the only theory
    that explains why the Black Crusades were fought as they were.
  aliases: [Great Rift opening, Warpscar, Everdusk, Mont'yhe'va, Dathedian, War in the Rift]
  see_also: [the-sundered-imperium, black-crusades, thirteenth-black-crusade]

guillimans-return:
  name: the resurrection of Guilliman
  gloss: >
    Body mended by Mechanicum engineering, soul restored by the Aeldari god Ynnead, route provided by
    Harlequins, arranged by a Tech-Priest concealing a ten-thousand-year lifespan. Not one element
    of it is lawful under Imperial doctrine.
  aliases: [Rise of the Primarch, Armour of Fate, Temple of Correction, Shrine of Guilliman, Belisarius Cawl]
  see_also: [ultramar, the-primaris, thirteenth-black-crusade]

the-primaris:
  name: the Primaris Space Marines
  gloss: >
    Guilliman's ten-thousand-year contingency, built by Cawl from STC technologies and genetic data
    on all twenty Primarchs, and held in stasis aboard the Zar-Quaesitor being taught in their
    sleep. Pre-Primaris Astartes are now "Firstborn".
  aliases: [Primaris, Primaris Space Marine, Firstborn, Sangprimus Portum, Zar-Quaesitor]
  see_also: [guillimans-return, the-codex-astartes]

indomitus-crusade:
  name: the Indomitus Crusade
  gloss: >
    Guilliman's reconquest, declared on leaving the Emperor's Throneroom and manned by stripping the
    garrisons off worlds already judged lost. It founded new Chapters on new homeworlds, stabilised a
    warp passage with Necron pylon technology, and has already lost an entire fleet to Angron.
  aliases: [Indomitus Crusade, Unnumbered Sons, Ultima Founding, Attilan Gate, Torchbearer, Fleet Quartus]
  see_also: [guillimans-return, the-primaris, opening-of-the-great-rift]

pariah-nexus:
  name: the Pariah Nexus
  gloss: >
    The Necrons' Contra-Empyric Nexus: a Blackstone array built by Szeras, the Cryptek who ran the
    biotransference furnaces, to exclude the Warp from a whole sector. Three wars are being fought
    inside it at once, one of them between Necrons.
  aliases: [Pariah Nexus, Contra-Empyric Nexus, Zone of Silence, Nephilim Anomaly, the Stilling, Szeras, Xendu System]
  see_also: [the-awakening, black-crusades, biotransference]

fourth-tyrannic-war:
  name: the Fourth Tyrannic War
  gloss: >
    Leviathan's largest invasion: two coordinated tendrils, Nautilon and Promethor, entering from
    above and below the galactic plane and advancing in parallel towards Terra — into a Segmentum whose
    garrisons the Indomitus Crusade had withdrawn.
  aliases: [Fourth Tyrannic War, Nautilon, Promethor, Shadow in the Warp, Guideoth]
  see_also: [first-tyrannic-war, indomitus-crusade]

fall-of-the-eldar:
  name: the Fall of the Eldar
  gloss: >
    The Aeldari Empire's collapse into excess, which birthed Slaanesh, tore open the Eye of Terror,
    and — by calming the Warp — ended humanity's Age of Strife. The most consequential event in the
    setting's history, and the brief's table of contents gives it no Chapter of its own.
  aliases: [the Fall, Fall of the Aeldari, the birth of Slaanesh, Aeldari decadence]
  see_also: [age-of-strife, regions-of-ruin, the-young-races]

senatorum-imperialis:
  name: the Senatorum Imperialis
  gloss: >
    The Council of the High Lords of Terra — twelve office-holders, nine of them
    effectively permanent, who interpret and enact the will of a silent Emperor.
  aliases: [High Lords of Terra, the High Twelve, Council of the High Lords, Great Chamber, Primarch's Scourge, Hexarchy, Chancellor of the Imperial Council, Inquisitorial Representative]

the-beheading:
  name: the Beheading
  gloss: >
    The coup of 546.M32, in which Grand Master of Assassins Drakan Vangorich killed every
    High Lord and ruled the Imperium for a century through a puppet cabinet.
  aliases: [Drakan Vangorich, War of the Beast, Koorland, Maximus Thane, puppet cabinet, War Council, Council of Terra]
  see_also: [senatorum-imperialis]

the-administratum:
  name: the Adeptus Administratum
  gloss: >
    The Imperium's bureaucracy — billions of hereditary clerks recording tithes and
    censuses on vellum, in departments large enough to have been lost and forgotten.
  aliases: [Adeptus Administratum, Scriptists, Enumerators, Departmento Munitorum, Departmento Exacta, Historical Revision Unit, Logis Strategos, Master of the Administratum, vellum]
  see_also: [senatorum-imperialis]

adeptus-arbites:
  name: the Adeptus Arbites
  gloss: >
    The Adeptus Terra's police, enforcing the Lex Imperialis rather than local law. Their
    common duty is confirming that each world's Governor pays the tithe.
  aliases: [Adeptus Arbites, Arbites, Arbitrator, Lex Imperialis, Book of Judgement, Injuncta Cardinal, Grand Provost Marshal, Precinct Fortress]
  see_also: [the-administratum]

rogue-traders:
  name: Rogue Traders
  gloss: >
    Holders of a hereditary Warrant of Trade, licensed to travel beyond the Imperium and
    to deal with xenos and non-Imperial humans as they see fit.
  aliases: [Rogue Trader, Warrant of Trade, Jan van Yastobaal]
  see_also: [adeptus-arbites]

officio-assassinorum-org:
  name: the Officio Assassinorum
  gloss: >
    A subdivision of the Administratum whose head sits on the Senatorum, and whose
    assassins may be deployed only on a two-thirds majority of the High Lords.
  aliases: [Office of Assassins, Grand Master of Assassins, Lord Assassins, two-thirds majority, Maerorus Temple]
  see_also: [the-clades, senatorum-imperialis, the-administratum]

the-clades:
  name: the Assassin Clades
  gloss: >
    The six extant temples of the Officio — Vindicare, Eversor, Culexus, Callidus, Vanus
    and Venenum — each specialising in a distinct method, plus the Adamus, whose current
    status the Imperium's own records cannot establish.
  aliases: [Vindicare, Eversor, Culexus, Callidus, Vanus, Venenum, Adamus Temple, Exitus Rifle, Animus Speculum, polymorphine, infocyte, bio-meltdown, cryo-crypt, Meh'Lindi, Tormentius, Fon Tariel]
  see_also: [officio-assassinorum-org]

hive-worlds:
  name: Hive Worlds
  gloss: >
    Roughly 32,380 worlds whose populations, often exceeding a trillion, live inside
    stacked cities with no natural ground surface left and almost all food imported.
  aliases: [Hive World, hive city, hive cluster, spire, heat sink, hab zone, manufactory, skyhive, Clan House, Necromunda, Lord Helmawr]
  see_also: [the-underhive]

the-underhive:
  name: the Underhive
  gloss: >
    The layers below a hive city, outside the reach of the Governor, the Clan Houses and
    the guilds — built in the ruins of the world's original colony settlements.
  aliases: [Underhive, Badzones, undercity, Dust Falls, Dead End Pass, Hive Scum, Scummers, hab-rat]
  see_also: [hive-worlds]

imperial-citizenship:
  name: Imperial citizenship
  gloss: >
    Confers no rights, only responsibilities. Adepts alone hold guaranteed housing and
    employment; everyone else owes the tithe and may be governed in any way at all,
    provided their world pays it.
  aliases: [Imperial citizen, Imperial Tithe, Grand Harvesting, Terra's Due, Exacta, Eaxector, Adept]
  see_also: [the-administratum, corpse-starch]

corpse-starch:
  name: corpse-starch
  gloss: >
    Synthetic food rendered from the recycled dead of the Imperium's own citizens, issued
    on hive worlds and to unlucky Astra Militarum regiments. Expressing disgust at it is
    treated in some places as sedition.
  aliases: [Corpse-Starch, Corpse Starch, protein reclamator, Mercator Pallidus, Corpse Guild, Corpse Grinders, Pale Consort]
  see_also: [hive-worlds, imperial-citizenship]

shrine-worlds:
  name: Shrine Worlds
  gloss: >
    Worlds devoted to a saint and ruled directly by the Adeptus Ministorum, drawing
    pilgrims from across the Imperium and lit by candles rendered from human bodies.
  aliases: [Shrine World, Shrineworld, Cathedral World, Tallow World, Hagia, Herodor]
  see_also: [imperial-citizenship]

schola-progenium:
  name: the Schola Progenium
  gloss: >
    Ecclesiarchy-run academies that raise the orphans of Imperial servants — some of them
    orphaned to order — into the Imperium's officer class. A Munitorum offshoot staffed by
    the Ministorum, whose three recorded outcomes are progena, truant and dead.
  aliases: [Schola Progenium, Progena, progenii, truants, drill abbot, sol-lamps, Commandant of the Schola Progenium, Emperor's Day, Officio Prefectus]
  see_also: [the-commissariat, officio-assassinorum-org]

the-commissariat:
  name: the Commissariat
  gloss: >
    The Departmento Munitorum department that assigns Commissars to Guard regiments and
    Navy ships, with the right and duty to execute any soldier or officer showing cowardice
    or incompetence.
  aliases: [Commissar, Commissars, Ordo Tempestus, Tempestus Scions, Militarum Tempestus, storm troopers]
  see_also: [schola-progenium]

abhumans:
  name: abhumans
  gloss: >
    Human subspecies that evolved in isolation during the Age of Strife. The Imperium
    recognises 73 stable strains, 46 of them extinct, and its own record holds them no more
    prone to mutation than baseline humans.
  aliases: [Abhuman, Ogryn, Ogryns, Ratling, Ratlings, Beastman, Beastmen, Felinid, Felinids, Kin, Squats, Halflings, Bone 'ead, Militarum Auxilla, Homo sapiens gigantus, Slabs]
  see_also: [the-mutant-line, imperial-citizenship]

the-mutant-line:
  name: the mutant line
  gloss: >
    The administrative boundary between recognised abhuman strains, sanctioned mutants
    holding a work pass, and the illegal remainder — in a population where one birth in
    twenty to healthy parents produces a mutant.
  aliases: [Mutant, Mutants, Sanctioned-Mutation Work Pass, sanctioned strain, scavvy]
  see_also: [abhumans]

the-imperial-creed:
  name: the Imperial Creed
  gloss: >
    Five compulsory tenets — the Emperor's godhood, the rejection of prior faiths, the
    purging of heretic, psyker, mutant and alien, a divinely ordered place for everyone,
    and unquestioning obedience. Everything else is left to the world.
  aliases: [Imperial Truth, Lectitio Divinitatus, Temple of the Saviour Emperor, Fatidicus, Euphrati Keeler, Grand Pilgrimage, Confederation of Light]
  see_also: [the-ecclesiarchy, imperial-citizenship]

the-ecclesiarchy:
  name: the Ecclesiarchy
  gloss: >
    The Adeptus Ministorum — the state church, deliberately not part of the Adeptus Terra,
    whose Ecclesiarch holds a permanent High Lord's seat and whose several thousand
    Cardinals each govern a diocese of roughly one world.
  aliases: [Adeptus Ministorum, Ministorum, Holy Synod, diocese, Creed Temporal, Arch-Deacon, Pontifex, Militant-Apostolic, Decree Passive, Ecclesiarchal Palace]
  see_also: [the-imperial-creed, shrine-worlds, schola-progenium]

imperial-sainthood:
  name: Imperial sainthood
  gloss: >
    An honour the Ecclesiarchy confers for faith, usually posthumously — and a conversion
    tool, since canonising a world's existing heroes redirects its devotion without
    replacing it. Living Saints require a conclave of church and Inquisition.
  aliases: [Imperial Saint, Living Saint, Living Saints, Saint Celestine, Saint Sabbat, Sister Repentia, Palatine Schism, Macharian Crusade]
  see_also: [wars-of-faith, the-ecclesiarchy]

wars-of-faith:
  name: Wars of Faith
  gloss: >
    Religious wars ordered by the Ecclesiarch alone and fought by the Ministorum's own
    forces, funded from church resources — subject only to a High Lords' veto, and usable
    against heretical factions of the Ecclesiarchy itself.
  aliases: [War of Faith]
  see_also: [imperial-sainthood, the-ecclesiarchy]

missionaria-galaxia:
  name: the Missionaria Galaxia
  gloss: >
    The Ministorum's missionary arm, attached to exploratory vessels and willing to spend
    generations replacing a world's gods — planting coded prophecies for its own
    successors to fulfil.
  aliases: [Missionarus Galaxia, Ministorum Galaxia, Missionary, Missionaries, Confessor, Confessors, Preacher, coded prophecies]
  see_also: [the-ecclesiarchy, frateris-militia]

frateris-militia:
  name: the Frateris Militia
  gloss: >
    Mobs of the faithful raised for Wars of Faith, tolerated because they have no formal
    connection to the Ecclesiarchy — the device by which a church forbidden men under arms
    fields an army.
  aliases: [Frateris Templars, Confessor-Sergeant, Redemption Cult, Redemptionists, Crusade of the Red Redemption, Zealot]
  see_also: [missionaria-galaxia, wars-of-faith]

adepta-sororitas:
  name: the Adepta Sororitas
  gloss: >
    The Ecclesiarchy's only legal fighting force, permitted because the Decree Passive
    forbade the church "men under arms" and Sebastian Thor left the all-female order in
    place — a loophole the sources call blatantly disregarding the decree's spirit.
  aliases: [Sisters of Battle, the Sisterhood, Daughters of the Emperor, Brides of the Emperor, Orders Militant, Orders Hospitaller, Orders Dialogus, Orders Famulous, Canoness, Alicia Dominica, San Leor, Ophelia VII, Convent Prioris, Convent Sanctorum, Rosarius]
  see_also: [the-ecclesiarchy, wars-of-faith, frateris-militia]

space-marine-implants:
  name: the Space Marine implants
  gloss: >
    Nineteen to twenty-two organs, implanted from about age ten, that convert a hive-gang
    recruit into an Astartes — including one that lets him learn by eating and one that
    can hold him in suspended animation for millennia.
  aliases: [Secondary Heart, Black Carapace, Omophagea, Sus-an Membrane, Catalepsean Node, Preomnor, Multi-lung, Oolitic Kidney, Occulobe, Neuroglottis, Melanchromic Organ, Ossmodula, Biscopea, Larraman's Organ, Betcher's Gland, Sinew Coils, Magnificat, Belisarian Furnace, neophyte]
  see_also: [gene-seed]

gene-seed:
  name: gene-seed
  gloss: >
    The genetic material from which a Chapter grows its implants, produced only inside the
    progenoid glands of living Marines — which is why the Astartes retrieve their dead.
  aliases: [progenoid, progenoid gland, zygote, Firstborn]
  see_also: [space-marine-implants]

the-codex-astartes-doctrine:
  name: the Codex Astartes
  gloss: >
    Guilliman's post-Heresy treatise, written to ensure no Astartes force could threaten
    the Imperium again: ten companies of a hundred, a Chapter Master, and a ceiling of one
    thousand that his own reforms in M42 left untouched.
  aliases: [Codex Chapters, Apocrypha of Skaros, Chapter Master, Battle Company, Veteran Company, Terminator Armour, Apothecarion, Reclusiam, Librarius, Armoury, Chapter Fleet, Master of the Watch, Master of the Fleet, Master of the Marches, Intercessor, Battleline Squad]
  see_also: [space-marine-implants, the-codex-astartes]

the-loyalist-legions:
  name: the nine loyalist Legions
  gloss: >
    The First Founding Legions still loyal when the Heresy ended — Dark Angels, White
    Scars, Space Wolves, Imperial Fists, Blood Angels, Iron Hands, Ultramarines,
    Salamanders and Raven Guard — broken into thousand-Marine Chapters by the Codex.
  aliases: [Legiones Astartes, Space Marine Legion, First Founding, Ultramarines, Imperial Fists, Blood Angels, Dark Angels, Space Wolves, White Scars, Raven Guard, Salamanders, Iron Hands, Deathwing, Unforgiven, the Fallen, Vlka Fenryka, Wulfenkind, Black Rage, Marneus Calgar, Logan Grimnar, Azrael, Dante, Tu'Shan, Kardan Stronos, Jubal Khan, Allfather]
  see_also: [the-codex-astartes-doctrine, gene-seed, the-primarchs]

the-foundings:
  name: the Foundings
  gloss: >
    The occasions on which new Chapters are created, aiming at a thousand at a time —
    including the Dark Founding, whose gene-seed Terra does not hold, and the Cursed 21st,
    whose Chapters fell to mutation, heresy and rebellion.
  aliases: [Founding, Second Founding, Dark Founding, Cursed Founding, Sentinel Founding, Progenitor, Black Templars, Crimson Fists, Flesh Tearers, Carcharodons, Space Sharks, Blood Ravens, Sigismund, Pedro Kantor, Rynn's World, Arx Tyrannus, Sons of Medusa, Founding Chapter, Grey Knights]
  see_also: [the-loyalist-legions, gene-seed, the-codex-astartes-doctrine]

astra-militarum:
  name: the Astra Militarum
  gloss: >
    The Imperial Guard — billions of soldiers in millions of regiments, uncountable even by
    the office that raises them, and deliberately denied combined arms so that a regiment
    which rebels cannot fight a full war.
  aliases: [Imperial Guard, Guardsmen, Militarum Regimentum, Planetary Defence Force, PDF, Battle Group, Astra Militarum Company]
  see_also: [the-munitorum, the-commissariat]

the-munitorum:
  name: the Departmento Munitorum
  gloss: >
    The Administratum department that raises, trains, equips and moves the Imperial Guard —
    and which the Guard itself regards as ineffective.
  aliases: [Departmento Munitorum, Munitorium]
  see_also: [astra-militarum, the-administratum]

famous-regiments:
  name: the renowned Guard regiments
  gloss: >
    Cadians, Catachans, the Death Korps of Krieg, the Tanith First and Only, Mordians,
    Tallarns and Valhallans — six of the seven defined by a catastrophe their world
    suffered, and one by a discipline it chose.
  aliases: [Cadian Shock Troopers, Catachan Jungle Fighters, Death Korps of Krieg, Korpsmen, Tanith First and Only, Gaunt's Ghosts, Mordian Iron Guard, Tallarn Desert Raiders, Valhallan Ice Warriors]
  see_also: [astra-militarum, death-worlds, bastion-worlds]

the-imperial-navy:
  name: the Imperial Navy
  gloss: >
    The Navis Imperialis — five Segmentum fleets, split from the Imperial Army after the
    Heresy so that no force could both cross the galaxy and land an army, and crewed at the
    bottom by bondsmen seized off the nearest world.
  aliases: [Navis Imperialis, Imperialis Armada, Battlefleet, Battlefleet Solar, Battlefleet Gothic, Lord Admiral, Naval Security, Naval Armsmen, Fleet Commissariat, bondsmen, Press Gang, Hydraphur, Cypra Mundi]
  see_also: [astra-militarum, imperial-astrography]
