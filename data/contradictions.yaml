cadian-pylon-dimensions:
  kind: numerical
  status: resolved
  reverified: true
  reverified_on: 2026-07-25
  seeded_from: PROMPT.md §11
  summary: >
    The pylons are one kilometre tall, of which half a kilometre is below ground, and half
    a kilometre on each side.
  reverification_note: >
    THE BRIEF'S OWN CORRECTION WAS WRONG, and wrong on two counts. PROMPT.md §11 records the
    pylons as "500 metres high, 250 metres square" and explicitly flags kilometre-scale
    figures as a mistake made in a prior draft. The source says the opposite: one kilometre
    tall, half a kilometre under the earth, half a kilometre on each side. So the kilometre
    scale is correct for the total height, and each side is 500 metres rather than 250.

    The 500-metre figure the brief preserved is most plausibly the ABOVE-GROUND portion —
    one kilometre total less the half-kilometre buried — which would make the prior draft
    the brief set out to correct closer to right than the correction itself.

    Recorded as the clearest case so far of why §11 says re-verify rather than trust: the
    seeded corrections are not more reliable than the material they correct.
  handling: >
    One kilometre tall, half below ground, half a kilometre square. Do not repeat the
    250-metre figure. Cadia itself is II.T3.Ch8.
  positions:
    - claim: One kilometre tall, half a kilometre buried, half a kilometre on each side.
      source: lex-pylon
      marker: "citation 4a — Malleus (Novel), Chapter Twelve"

