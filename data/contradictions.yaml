  reverified: false
  seeded_from: PROMPT.md §11
  summary: >
    The fraction of an Imperial year represented by a check number is given variously
    as ~8.5 hours and ~8h45m; arithmetic on a standard year yields ~8h46m. Lexicanum
    reportedly notes that no in-universe source specifies the division method at all.
  positions: []

the-veil-as-structure:
  kind: undefined
  status: undefined
  reverified: false
  seeded_from: PROMPT.md §11
  summary: >
    "The Veil" is widely used for the Materium/Immaterium boundary, but per the brief
    no source defines it as a structure with measurable properties.
  handling: >
    Treat as metaphor, not mechanism. Do NOT assign it a thickness, composition or
    location. Volume I Title 1 Chapter 4 is titled "The Veil & Metaphysical
    Boundaries" and must be written around this absence rather than filling it.
  positions: []

