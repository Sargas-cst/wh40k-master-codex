slanni-old-ones-identity:
  kind: undefined
  status: undefined
  reverified: true
  reverified_on: 2026-07-25
  found_in: Volume III Title 1 research
  summary: >
    The Slanni are the Old Ones, were the Old Ones, or have merely inherited their legacy.
  reverification_note: >
    The article's opening sentence carries all three readings at once — "are or were or have
    inherited the legacy of the Old Slann" — with a separate citation behind each. It is not
    a disagreement between sources so much as a deliberate refusal to fix the relationship:
    "Old Slann" is used elsewhere as a plain synonym for the Old Ones, yet the Slanni are
    described as a species still extant, which the Old Ones are not.
  handling: >
    Say Old Ones where the Old Ones are meant. Never treat the Slanni as surviving Old Ones,
    and never assert they are unrelated. The relationship is undefined and stays that way.
  positions:
    - claim: The Slanni are the Old Ones.
      source: lex-slanni
      marker: "citation 1b — Warhammer 40,000: Rogue Trader, pgs. 194-196"
    - claim: The Slanni merely inherited the legacy of the Old Slann.
      source: lex-slanni
      marker: "citations 5 and 6"

empyrean-before-the-young-races:
  kind: sequence
  status: open
  reverified: true
  reverified_on: 2026-07-25
  found_in: Volume III Title 1 research
  summary: >
    The Empyrean was peaceful until the Young Races disturbed it, or it already held the
    predatory Powers of Chaos before they existed.
  reverification_note: >
    Two articles, two incompatible states of the Warp before the War in Heaven. The Enslaver
    article says the Young Races' growing pains "disturbed the peaceful Empyrean, turning it
    into a hellish environment filled with now-deadly Warp predators". But the Old Ones'
    own spiritual doctrine — that a perfected mind survives death in the Warp provided it can
    resist the diseased consciousnesses of the Powers of Chaos — presupposes predatory Warp
    intelligences already present, and is described as something the Old Ones TAUGHT the
    Eldar rather than something they learned late.

    What both accounts support is narrower and still substantial: whatever was there
    beforehand, the war made it far worse, and the Enslavers specifically are dated to the
    war rather than before it.
  handling: >
    Record both. Do not state that Chaos originated in the War in Heaven, and do not state
    that the pre-war Warp was benign. Date the Enslavers to the war, which both agree on.
  positions:
    - claim: The Empyrean was peaceful before the Young Races.
      source: lex-enslaver
      marker: "citation 3 — Codex: Necrons (3rd Edition), pg. 26"
    - claim: The Powers of Chaos were already there, and the Old Ones taught resistance to them.
      source: lex-slanni
      marker: "citation 3a — Codex Titanicus (1st Edition), pg. 52"

psykers-before-navigators:
  kind: sequence
  status: open
  reverified: true
  reverified_on: 2026-07-25
  found_in: Volume III Title 2 research
  summary: >
    Widespread human psykers appeared before the Navigators were created, or after warp
    travel and Navigators were already established.
  reverification_note: >
    The article carries a dedicated Conflicting Sources section on this and, unusually,
    reasons about the reliability of its own sources rather than merely listing them. The
    Deathwatch Core Rulebook and Horus Heresy: Collected Visions share identical text placing
    Navigators after psykers — but the article notes one may be an IN-UNIVERSE Inquisition
    document, judging by the artistic style of the page, and therefore fallible. Rulebooks
    written as out-of-universe resources put widespread psykers in M22, after Navigators, and
    a further source puts the psyker emergence in M25, after warp drives and Gellar fields
    both.
  handling: >
    Do not order the two. State that both existed before the collapse and that the psychic
    emergence was the more dangerous development, which every account supports.
  positions:
    - claim: Navigators appeared after psykers and widespread warp travel.
      source: lex-dark-age-of-technology
      marker: "citations 24a and 42 — Deathwatch Core Rulebook pg. 290; Collected Visions pg. 7"
    - claim: Psykers became widespread in M22, after Navigators.
      source: lex-dark-age-of-technology
      marker: "citation 7 — Warhammer 40,000 6th Edition Rulebook, pg. 167"
    - claim: The psyker emergence came in M25, after Navigators, warp drives and Gellar fields.
      source: lex-dark-age-of-technology
      marker: "citation 49 — Wrath & Glory: Church of Steel, pg. 6"

cybernetic-revolt-date:
  kind: numerical
  status: open
  reverified: true
  reverified_on: 2026-07-25
  found_in: Volume III Title 2 research
  summary: >
    The Cybernetic Revolt began between M23 and M25, or ravaged the cosmos in late M26.
  reverification_note: >
    The Dark Age of Technology article carries its own note on this, and the interesting part
    is that the disagreement tracks the KIND of source. The later placement comes from the
    Journal of Keeper Cripias — an in-universe reconstruction by a 41st-Millennium Keeper of
    the Library Sanctus, whose wording the article describes as unclear as between M25 and
    M26. The earlier range comes from a rulebook written as an out-of-universe resource. The
    Men of Iron article separately dates the turning to M23.

    A three-thousand-year discrepancy is exactly what one would expect if the in-universe
    account is what it presents itself as: a scholar working from ruins, forty millennia later.
  handling: >
    Do not assign the Revolt a millennium. Where the date matters, say that the in-universe
    and out-of-universe accounts differ and why — the unreliability is itself the point.
  positions:
    - claim: Between M23 and M25.
      source: lex-dark-age-of-technology
      marker: "citation 7 — Warhammer 40,000 6th Edition Rulebook, pg. 167"
    - claim: Late M26, per an in-universe 41st-Millennium history.
      source: lex-cybernetic-revolt
      marker: "citation 1 — Warhammer 40,000 3rd Edition Rulebook, pg. 278"

thunder-warriors-fate:
  kind: sequence
  status: open
  reverified: true
  reverified_on: 2026-07-25
  found_in: Volume III Title 3 research
  summary: >
    The Thunder Warriors all died at the Battle of Mount Ararat, or the Emperor massacred them
    and fabricated Mount Ararat to cover it.
  reverification_note: >
    This is not two texts disagreeing about a date. It is an official Imperial history
    contradicted by a named witness — the surviving Thunder Warrior Arik Taranis — who, if the
    official history were true, could not be testifying at all. His existence is itself the
    counter-evidence.

    The account allows three readings: that the Emperor simply did not replenish their
    numbers, that he massacred them outright, or that he used the battle to expend the last of
    them. The purges are implied to have been carried out by the Templi Veritas of the Legio
    Custodes. The stated motive is consistent across all three: the Thunder Warriors were
    suitable for conquering Terra but did not fit a vision of warriors who would take the
    galaxy.
  handling: >
    Give the official account as the official account, and Taranis's as a witness statement.
    Do not present Mount Ararat as settled fact, and do not assert the massacre either.
  positions:
    - claim: All died at the Battle of Mount Ararat; the Astartes were created to replace them.
      source: lex-thunder-warriors
      marker: "citation 2 — The Outcast Dead (Novel), Imperial history"
    - claim: The Emperor massacred them and fabricated Mount Ararat as a cover-up.
      source: lex-thunder-warriors
      marker: "citation 2 — The Outcast Dead (Novel), per Arik Taranis"

primarch-scattering-cause:
  kind: sequence
  status: open
  reverified: true
  reverified_on: 2026-07-25
  found_in: Volume III Title 3 research
  summary: >
    The Primarchs were scattered by the Chaos Gods, by a causal loop in which time-travelling
    Word Bearers disabled the Gellar Fields protecting them, or by the Perpetual Erda.
  reverification_note: >
    Three accounts, and they are structurally different rather than merely rival. The first is
    the plain statement that the Chaos Gods spirited the infants away with a Warp vortex. The
    second has Argel Tal and his men sent back in time inside the Eye of Terror to the
    Emperor's laboratory and persuaded by the daemon Ingethel to destroy the Gellar Field
    generators — after which the vortex took the Primarchs almost immediately. The third has
    Erda, whose own genetic material went into them, creating the vortex out of anger at the
    fate the Emperor planned for her "children", with Erebus adding that she was unwittingly
    manipulated by the Chaos Gods.

    The second and third can be read as MECHANISMS for the first rather than alternatives to
    it, since both have Chaos acting through intermediaries. Whether that reconciliation is
    intended or whether these are three unreconciled stories, the sources do not say.
  handling: >
    Give all three and note that two of them describe Chaos acting through agents. Do not
    present any single account as what happened.
  positions:
    - claim: The Chaos Gods spirited them away with a Warp vortex.
      source: lex-primarch
      marker: "citation 9 — False Gods (Novel), Chapters 15-16"
    - claim: A causal loop — time-displaced Word Bearers disabled the Gellar Fields.
      source: lex-primarch
      marker: "citation 14 — The First Heretic (Novel), Chapter 17"
    - claim: Erda created the vortex, possibly manipulated into it.
      source: lex-primarch
      marker: "citation 38a; citation 6 — Warhawk (Novel), Chapter 13"

first-primarch-found:
  kind: sequence
  status: open
  reverified: true
  reverified_on: 2026-07-25
  found_in: Volume III Title 3 research
  summary: >
    Horus was the first Primarch found, or Alpharius was, having landed on Terra itself.
  reverification_note: >
    The article calls the Alpharius version "a dubious account given by Alpharius" — the
    unreliability is attributed in the source, not added here. It is worth recording anyway,
    because Alpharius is the Primarch defined by deception, and a claim by him to have been
    first and to have landed on Terra is exactly the claim he would make whether or not it
    were true. The traditional account, that Horus was first and became the Emperor's
    favourite, carries the weight.
  handling: >
    State Horus as the traditional account and Alpharius's as his own dubious claim. Do not
    treat the latter as equally weighted.
  positions:
    - claim: Horus was found first and became the Emperor's favourite.
      source: lex-primarch
      marker: "citation 30e — Index Astartes IV, The Enemy Within"
    - claim: Alpharius was first, landing on Terra — by his own dubious account.
      source: lex-primarch
      marker: "citation 40a — Discovery"

emperors-final-words:
  kind: edition
  status: open
  reverified: true
  reverified_on: 2026-07-25
  found_in: Volume III Title 3 research
  summary: >
    The Emperor delivered a valedictory address before ascending the Golden Throne, or he spoke
    a single word that Dorn could not make out.
  reverification_note: >
    The article sets the two accounts out side by side, and the disagreement is not about detail
    but about whether he spoke at all.

    In Horus Heresy: Collected Visions he is found alive, sustained by a fragment of strength
    Malcador reserved for him, and speaks at length — naming Malcador, explaining that his
    powers will return but his body will never heal, and instructing Dorn and Jaghatai to fight
    on: "This is just the beginning of our crusade to save Humanity."

    In The End and the Death: Volume III he does not speak during the deliberation at all. Leetu
    suggests the Throne after looking at an Imperial Tarot deck, and Dorn's later account of the
    only thing the Emperor said is: "He said one word to me as I took him to the seat. 'Now,' I
    think He said. Or it might have been 'No.'"

    What is at stake is consent. In one account the Emperor commands the Throne and founds the
    Imperium's mission with his last breath; in the other he may have been refusing it, and the
    man carrying him could not tell.
  handling: >
    Give both. Never quote the valedictory speech as the Emperor's settled last words, and never
    assert that he consented to the Throne.
  positions:
    - claim: A full valedictory address, instructing Dorn and Jaghatai to fight on.
      source: lex-siege-of-terra
      marker: "citation 32 — Horus Heresy: Collected Visions, pgs. 366-367"
    - claim: One word, 'Now' or possibly 'No', per Dorn's own account.
      source: lex-siege-of-terra
      marker: "citation 31f — Ashes of the Imperium (Novel), Chapter 11"

who-stood-before-horus:
  kind: edition
  status: resolved
  reverified: true
  reverified_on: 2026-07-25
  found_in: Volume III Title 3 research
  summary: >
    A Custodian, a Space Marine, or the lone Guardsman Ollanius Pius stood between Horus and the
    Emperor's broken body.
  reverification_note: >
    Long ambiguous across editions, and deliberately resolved by making every version true in
    sequence: the article records that the Black Library novelisation "reveal all three to have
    been true at different points". Caecaltus Dusk the Custodian, Garviel Loken the Space Marine,
    and Ollanius Persson each intervene in turn.

    Recorded here as resolved because the resolution is the notable fact — three incompatible
    accounts of the setting's most famous act of defiance were reconciled by staging all three.
  handling: >
    Give the sequence rather than choosing a version, and note that the multiplicity was
    intentional.
  positions:
    - claim: Ambiguous — a Custodian, a Space Marine, or the Guardsman Ollanius Pius.
      source: lex-siege-of-terra
      marker: "citation 1d — Horus Heresy (Artbook Series), pgs. 362-369"
    - claim: All three, at different points.
      source: lex-siege-of-terra
      marker: "citation 27g — The End and the Death: Volume III (Novel), 10:xii"

sanguinius-armour-chink:
  kind: edition
  status: open
  reverified: true
  reverified_on: 2026-07-25
  found_in: Volume III Title 3 research
  summary: >
    Sanguinius cracked a chink in Horus's armour which the Emperor later exploited, or he did not.
  reverification_note: >
    Listed among the article's own "Changes from Previous". The chink appears in the Horus Heresy
    artbook and is absent from the Black Library novelisation. It matters because it is what
    makes Sanguinius's death causally necessary in the older telling — his defeat enables his
    father's victory. Without it the Great Angel dies having bought time and nothing more.
  handling: >
    Record both. Do not present the chink as the reason the Emperor was able to win.
  positions:
    - claim: Sanguinius cracked the armour; the Emperor exploited it.
      source: lex-siege-of-terra
      marker: "citation 1d — Horus Heresy (Artbook Series), pgs. 362-369"
    - claim: Not present.
      source: lex-siege-of-terra
      marker: "citation 26e — The End and the Death: Volume II (Novel), 8:xxiii"

golden-throne-construction-date:
  kind: edition
  status: open
  reverified: true
  reverified_on: 2026-07-25
  found_in: Volume III Title 3 research
  summary: >
    The Golden Throne was built after Horus mortally wounded the Emperor, or it was complete and
    in use well before the Heresy.
  reverification_note: >
    The article carries this in its own Conflicting Sources section. In Realm of Chaos: The Lost
    and the Damned the Throne is constructed AFTER the wounding — the Emperor "dead by any
    ordinary understanding" but with enough living cells for his spirit to animate the body,
    letting him speak and supervise its construction. Later sources have the Throne finished and
    in use well before the Heresy, as the control station of the Webway Project.

    The difference is not chronological trivia. On the older account the Throne is purpose-built
    life support the Emperor designed for himself while dying. On the later one it is a recovered
    Dark Age portal control that he was forced to remain on because Magnus's breach left a hole
    only he could hold shut.
  handling: >
    Follow the later account, because the Webway Project and the War Within the Webway both
    require the Throne to exist beforehand — but record the earlier version rather than discarding
    it, and do not present the Throne as having been designed as life support.
  positions:
    - claim: Constructed after the wounding, under the dying Emperor's supervision.
      source: lex-golden-throne
      marker: "citation 20 — Realm of Chaos: The Lost and the Damned, pg. 185"
    - claim: Complete and in use well before the Horus Heresy.
      source: lex-golden-throne
      marker: "citation 7 — Master of Mankind (Novel), Epilogue"

macragge-battle-date:
  kind: numerical
  status: open
  reverified: true
  reverified_on: 2026-07-25
  found_in: Volume III Title 4 research
  summary: >
    Hive Fleet Behemoth was destroyed at the Battle for Macragge in 745.M41, or in 746.M41.
  reverification_note: >
    The article flags the discrepancy itself — "depending on the source". A single year would
    normally be trivial, but the same article dates the first attack on Tyran to 745.M41 and has
    Kryptman recovering the buried data-codex "almost a year later". On the earlier date the whole
    war — first contact, the investigation, the failed astropathic relay, the salvage at Thandros,
    the voyage to Macragge and the battle itself — must fit inside one year, which the narrative
    cannot accommodate.
  handling: >
    Give both dates and note that the internal chronology of the article favours the later one.
    Do not silently pick either.
  positions:
    - claim: 745.M41.
      source: lex-behemoth
      marker: "citation 1a — Codex: Tyranids (5th Edition), pgs. 10-11"
    - claim: 746.M41.
      source: lex-behemoth
      marker: "citation 4 — Planetstrike, pg. 54"
