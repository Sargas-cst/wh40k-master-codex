  reverified_on: 2026-07-25
  seeded_from: PROMPT.md §11
  summary: >
    Both "Gellar field" and "Geller Field" are in use. This is not an unresolved
    conflict between sources: Lexicanum's own article opens by giving both spellings,
    and attributes the variant to an official Games Workshop web article.
  reverification_note: >
    The article's first sentence reads "Gellar Fields (also spelled Geller Field)"
    with a citation marker on the variant, and that marker resolves to a Warhammer
    Community article archived December 2024 — a TIER 1 source. So the variant is
    attested by GW themselves. The codex uses "Gellar field", matching the article
    title, and records the variant in the glossary rather than in prose.
  handling: >
    Do not present this as a live dispute. Note the variant once, in the glossary.
  positions:
    - claim: The primary spelling is "Gellar field".
      source: lex-gellar-field
      marker: article title and lead
    - claim: '"Geller Field" is also used, per an official GW web article.'
      source: lex-gellar-field
      marker: "citation 6"

imperial-year-fraction:
  kind: undefined
  status: undefined
  reverified: true
  reverified_on: 2026-07-25
  seeded_from: PROMPT.md §11
  summary: >
    The brief recorded competing figures of ~8.5h and ~8h45m for the Imperial year
    fraction, with arithmetic suggesting ~8h46m. Re-verification changes the shape of
    this entry: it is not a conflict between sources, because there are no sources.
  reverification_note: >
    The article states plainly that each year is divided into 1,000 equal parts, and
    that "an exact method for breaking the year fraction into 1000 equal parts is not
    given by in-universe sources". Every duration figure appears inside the article's
    a trivia block, and that block's support is a DakkaDakka forum post plus
    arithmetic contributed by named Lexicanum users in 2015 and 2025. That is tier 4
    material. So the figures are fan calculation, not canon in dispute.
  handling: >
    State that the year is divided into 1,000 parts and that no source specifies how.
    Do NOT quote any duration — not 8.5 hours, not 8h45m, not 8h46m. Reporting fan
    arithmetic as a contested canon figure would be the exact error the brief warns
    against, one level deeper.
  positions:
    - claim: The year is divided into 1,000 equal parts, numbered 000-999.
      source: lex-imperial-dating-system
      marker: "citation 1"
    - claim: No in-universe source specifies the method of division.
      source: lex-imperial-dating-system
      marker: "the article's trivia block"

the-veil-as-structure:
  kind: undefined
  status: undefined
  reverified: true
  reverified_on: 2026-07-25
  seeded_from: PROMPT.md §11
  summary: >
    "The Veil" is widely used for the boundary between the Materium and the
    Immaterium, but no retrieved source defines it as a structure with measurable
    properties. Re-verification found the position is stronger than the brief stated.
  reverification_note: >
    Lexicanum has an article at "Veil" and it is about a PERSON — a Navis Nobilite
    magister of the Great Crusade, sworn to House Achelieux, who destroyed the Dark
    Glass station during the Horus Heresy. There is no Lexicanum article treating the
    Veil as a cosmological boundary at all. The nearest attested formulation is in the
    Warp Rift article, which describes a rift as "a weakening of the barrier between
    real space and the Warp" — a barrier referred to but never named, located,
    measured or given composition.
  handling: >
    Treat as metaphor, not mechanism. Assign it no thickness, composition or location.
    Volume I Title 1 Chapter 4 is titled "The Veil & Metaphysical Boundaries" and its
    first proposed Section was "Structure of The Veil"; that Section was dropped,
    because writing it would have required inventing the thing it describes. The
    Chapter reports the absence instead.
  positions:
    - claim: Lexicanum's "Veil" article describes a person, not a boundary.
      source: lex-veil
      marker: whole article
    - claim: A rift is "a weakening of the barrier between real space and the Warp".
      source: lex-warp-rift
      marker: "citation 1"

