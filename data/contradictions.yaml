millennium-year-range:
  kind: edition
  status: open
  reverified: true
  reverified_on: 2026-07-25
  found_in: Volume I Title 1 research
  summary: >
    Whether the years within an Imperial millennium run 001-000 or 000-999. Lexicanum
    flags this itself under a conflicting-sources notice heading.
  notation_note: >
    "001-000" is not a countdown and does not imply time running backwards — a
    reasonable reading of the bare notation, and one the prose originally invited by
    stating the range without explaining it. The year field holds three digits, so the
    thousandth and final year of a millennium overflows to 000. The article's worked
    example demonstrates this: 1998 is written 998.M2, which places M2 across the
    years 1001-2000 and therefore makes the year 2000 into 000.M2.
  reverification_note: >
    Three citations give 001-000; one, the 5th Edition Rulebook, gives 000-999. The
    article notes that all of them claim to be based on the Anno Domini system, which
    has no year zero and so runs 001-000. A genuine edition-level disagreement, with
    an internal-consistency argument behind the majority reading.
  handling: >
    Present both, name the 5th Edition Rulebook as the outlier, resolve neither — and
    explain the notation, because the range is meaningless to a reader who has not
    been told that the field wraps at three digits.
  positions:
    - claim: >
        Years run 001 through to 000, where 000 is the LAST (thousandth) year of the
        millennium.
      source: lex-imperial-dating-system
      marker: "citations 1, 4 and 6"
    - claim: Years run from 000 to 999, starting at zero.
      source: lex-imperial-dating-system
      marker: "citation 5 — Warhammer 40,000 5th Edition Rulebook, pg. 126"

is-it-really-m42:
  kind: edition
  status: open
  reverified: true
  reverified_on: 2026-07-25
  found_in: Volume I Title 1 research
  summary: >
    Whether the period following the opening of the Great Rift is actually the 42nd
    Millennium is, per Lexicanum, "intentionally put into doubt by Games Workshop".
  reverification_note: >
    The dating article carries a conflicting-sources notice marker on its very first use
    of "42nd millennium". This is not an error between sources but a deliberate
    authorial refusal to fix the date — the setting declining to say what year it is.
  handling: >
    Excellent illustration of §4: the ambiguity is the content. Use it in Chapter 2
    and cross-reference from Chapter 1's account of the setting's unreliability.
  positions:
    - claim: The current period is the 42nd Millennium.
      source: lex-imperial-dating-system
      marker: article lead
    - claim: Whether it is M42 is intentionally left in doubt by GW.
      source: lex-imperial-dating-system
      marker: "the article's conflicting-sources block"

age-of-strife-start-date:
