space-wolves-fortress-world:
  kind: edition
  status: resolved
  reverified: true
  reverified_on: 2026-07-25
  found_in: Volume II Title 3 research
  summary: >
    The Space Wolves' fortress-monastery stands on Lucan, or it is the Fang on Fenris.
  reverification_note: >
    Traced to its origin. When the Chapter was introduced in White Dwarf 93, the
    fortress-monastery was sited on Lucan — described as airless, its fortress silent and
    without mirth. The chamber-by-chamber description of a "typical" fortress-monastery,
    transcribed from Rogue Trader, still names Lucan for its generatorum, its missile silos
    and its Great Hall. Lucan is separately identified as a VI Legion fief world of the Great
    Crusade era, which reconciles the two without either being wrong.
  handling: >
    Treat the chamber description as what a fortress-monastery contains, which is how it is
    presented. The Fang on Fenris is the Space Wolves' home. Record Lucan as the earliest
    published siting rather than as a competing present-day claim.
  positions:
    - claim: The fortress-monastery is on Lucan.
      source: lex-fortress-monastery
      marker: "citation 1 — Rogue Trader, pgs. 158-161"
    - claim: Lucan was the original published siting; Lucan is a VI Legion fief world.
      source: lex-fenris
      marker: "citation 36 — White Dwarf 93 (UK), pg. 39; citation 32"

