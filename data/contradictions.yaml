ctan-discovery-accounts:
  kind: sequence
  status: open
  reverified: true
  reverified_on: 2026-07-25
  found_in: Volume I Title 4 research
  summary: >
    How the Necrontyr found the C'tan. The archives of Solemnace record an accident — a
    chance discovery by a stellar probe investigating a dying star. The Aeldari Book of
    Mournful Night claims the Necrontyr's raw hatred for the Old Ones sang out across
    space and drew the C'tan like a beacon.
  reverification_note: >
    The article states outright that various conflicting accounts exist, and attributes
    each to a named in-universe archive. This is the setting's preferred form of
    unreliability: not an editorial error but two rival records, one Necron and one
    Aeldari, each with a motive for its version.
  handling: >
    Give both and attribute both to their archives. Do not synthesise. The disagreement
    between a Necron account and an Aeldari one is itself informative.
  positions:
    - claim: Discovery was accidental, by a stellar probe at a dying star.
      source: lex-c-tan
      marker: archives of Solemnace
    - claim: Necrontyr hatred drew the C'tan across space like a beacon.
      source: lex-c-tan
      marker: Aeldari Book of Mournful Night

