cadian-pylon-dimensions:
  kind: numerical
  status: open
  reverified: true
  reverified_on: 2026-07-25
  seeded_from: PROMPT.md §11
  summary: >
    The Cadian pylons are one kilometre tall with half a kilometre buried and half a kilometre
    on each side, or half a kilometre tall with a quarter-kilometre buried.
  reverification_note: >
    Two Lexicanum articles give figures in which every dimension of one set is exactly half
    its counterpart in the other — and BOTH cite the same chapter of the same novel, Malleus
    Chapter Twelve. The Cadia article adds a second citation, Codex: Eye of Terror (3rd
    Edition) pg. 5. One of the two readings must be a mistranscription of the primary text,
    and nothing available here settles which.

    PROMPT.md §11 records the pylons as "500 metres high, 250 metres square" and flags
    kilometre-scale figures as a prior draft's error. The 500-metre height matches the Cadia
    article; the 250-metre figure matches neither article's side measurement, and appears to
    be the tunnel length — the Cadia article gives tunnels "exactly two hundred fifty metres
    long", each no wider than a man's head.

    An earlier pass of this codex recorded the conflict as RESOLVED in favour of the
    kilometre-scale figures, on the strength of the pylon article alone, and stated in prose
    that the 500-metre figures were unsupported. That was wrong: they are supported, by two
    citations, one of them the same novel chapter. The entry is reopened.
  handling: >
    State both sets and note that they stand in exact 2:1 proportion and share a primary
    source. Assert neither. Do not carry the 250-metre figure as a side measurement at all —
    it is the tunnel length.
  positions:
    - claim: One kilometre tall, half a kilometre buried, half a kilometre on each side.
      source: lex-pylon
      marker: "citation 4a — Malleus (Novel), Chapter Twelve"
    - claim: Half a kilometre tall, a quarter-kilometre buried; tunnels 250 metres long.
      source: lex-cadia
      marker: "citation 2 — Malleus (Novel), Chapter Twelve; citation 1b — Codex: Eye of Terror (3rd Edition), pg. 5"

